<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>NEON RIOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#07050f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
/* ============================================================
   NEON RIOT — twin-stick-ish arena survival, 1-2 player co-op
   Auto-aim + auto-fire: you just move, dodge and survive.
   ============================================================ */
const W=1280,H=720,AX0=28,AY0=70,AX1=W-28,AY1=H-28;
const TAU=Math.PI*2;
const FONT='Orbitron,"Arial Black",Impact,system-ui,sans-serif';
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1,sc=1,ox=0,oy=0,vw=0,vh=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  sc=Math.min(vw/W,vh/H);ox=(vw-W*sc)/2;oy=(vh-H*sc)/2;
}
addEventListener('resize',resize);resize();
try{document.fonts&&document.fonts.load('900 20px Orbitron');}catch(e){}

/* ---------------- persistence ---------------- */
function loadBest(n){try{return +localStorage.getItem('neonriot_best'+n)||0;}catch(e){return 0;}}
function saveBest(n,v){try{localStorage.setItem('neonriot_best'+n,String(v));}catch(e){}}

/* ---------------- audio ---------------- */
let AC=null,master=null,noiseBuf=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextT=AC.currentTime+.1;
  }catch(e){AC=null;}
}
function tone(f,d,type,vol,slide,when){
  if(!AC||muted)return;
  const t0=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t0+d);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.03);
}
function noise(d,vol,ftype,freq,when){
  if(!AC||muted)return;
  const t0=AC.currentTime+(when||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=ftype;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*.5);s.stop(t0+d+.03);
}
const lastSfx={};
function can(n,gap){const now=performance.now();if(now-(lastSfx[n]||0)<gap)return false;lastSfx[n]=now;return true;}
const sfx={
  shoot(){if(can('shoot',70))tone(880,.06,'square',.035,-500);},
  hit(){if(can('hit',40))tone(220,.05,'sawtooth',.04,-100);},
  kill(){if(can('kill',45)){tone(300,.12,'triangle',.07,-220);noise(.08,.05,'highpass',3000);}},
  gem(){if(can('gem',35)){tone(700+Math.min(streak,12)*60,.07,'sine',.05,200);}},
  hurt(){tone(160,.3,'sawtooth',.16,-120);noise(.2,.12,'lowpass',900);},
  dash(){tone(300,.18,'sine',.1,700);noise(.15,.05,'bandpass',2200);},
  boom(){if(can('boom',60)){noise(.4,.2,'lowpass',700);tone(90,.35,'sine',.2,-60);}},
  level(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.06,0,i*.07));},
  down(){tone(220,.7,'sawtooth',.14,-170);noise(.5,.15,'lowpass',500);},
  revive(){[392,523,659].forEach((f,i)=>tone(f,.15,'triangle',.09,0,i*.08));},
  clear(){[392,494,587,784].forEach((f,i)=>tone(f,.2,'triangle',.08,0,i*.09));},
  pick(){tone(600,.1,'sine',.09,400);tone(900,.12,'sine',.07,300,.06);},
  wave(){tone(110,.5,'sawtooth',.12,60);tone(165,.5,'square',.04,60);},
  nova(){tone(200,.35,'sine',.12,500);}
};
/* tiny procedural soundtrack that gets denser as waves climb */
let step=0,nextT=0,mi=0;
const ROOTS=[33,33,29,31],ARP=[57,60,64,67];
const mf=n=>440*Math.pow(2,(n-69)/12);
function kick(t){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
function mtone(f,t,d,type,vol,lp){
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=lp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function mnoise(t,d,vol,ft,fr){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=ft;f.frequency.value=fr;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+d+.02);
}
let pulseAt=0;
function playStep(s,t){
  const bar=(s>>4)&3,k=s&15,root=ROOTS[bar];
  if(mi>0){
    if(k%4===0){kick(t);pulseAt=t;}
    if(k%4===2)mnoise(t,.04,.05,'highpass',7500);
    if(mi>=2&&k%2===1)mnoise(t,.025,.022,'highpass',9000);
    if(mi>=2&&(k===4||k===12))mnoise(t,.12,.1,'bandpass',1600);
  }
  if(k%2===0)mtone(mf(root+(k===6||k===14?12:0)),t,.2,'sawtooth',mi>0?.1:.06,mi>0?650:380);
  if(mi>=3)mtone(mf(ARP[(k>>1)%4]+(k>>3?12:0)),t,.12,'square',.03,2400);
}
function musicTick(){
  if(!AC||muted||AC.state!=='running')return;
  if(nextT<AC.currentTime-.2)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.14){
    if(state!=='pause')playStep(step,nextT);
    nextT+=60/138/4;step=(step+1)&63;
  }
}
setInterval(musicTick,30);

/* ---------------- input ---------------- */
const keys={},pressed={};
let touchMode=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches),stick=null,touchDash=false,mx=-1,my=-1;
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!keys[e.code])pressed[e.code]=true;
  keys[e.code]=true;initAudio();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')setPause(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')setPause(true);});
function toLogical(e){return {x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc};}
let uiBtns=[];
function uiClick(px,py){
  for(let i=uiBtns.length-1;i>=0;i--){const b=uiBtns[i];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){b.fn();return true;}}
  return false;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  if(e.pointerType==='touch')touchMode=true;
  const p=toLogical(e);mx=p.x;my=p.y;
  if(uiClick(p.x,p.y))return;
  if(state==='play'&&e.pointerType==='touch'){
    if(p.x<W*.5&&!stick)stick={id:e.pointerId,sx:p.x,sy:p.y,x:p.x,y:p.y};
    else touchDash=true;
  }
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  const p=toLogical(e);mx=p.x;my=p.y;
  if(stick&&e.pointerId===stick.id){stick.x=p.x;stick.y=p.y;}
});
function endPtr(e){if(stick&&e.pointerId===stick.id)stick=null;}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());

let pads=[];const padPrev={};
function pollPads(){
  pads=[];
  const g=navigator.getGamepads?navigator.getGamepads():[];
  for(const gp of g){
    if(!gp)continue;
    const prev=padPrev[gp.index]||[];
    const e=gp.buttons.map((b,k)=>b.pressed&&!prev[k]);
    padPrev[gp.index]=gp.buttons.map(b=>b.pressed);
    pads.push({ax:gp.axes[0]||0,ay:gp.axes[1]||0,b:gp.buttons.map(b=>b.pressed),e});
  }
}
function padAny(k){return pads.some(p=>p.e[k]);}

function getInput(p){
  let ax=0,ay=0,dash=false;
  const solo=nP===1;
  if(p.i===0){
    if(keys.KeyA||(solo&&keys.ArrowLeft))ax--;
    if(keys.KeyD||(solo&&keys.ArrowRight))ax++;
    if(keys.KeyW||(solo&&keys.ArrowUp))ay--;
    if(keys.KeyS||(solo&&keys.ArrowDown))ay++;
    dash=!!(pressed.Space||(solo&&(pressed.Enter||pressed.ShiftLeft||pressed.ShiftRight)));
    if(stick){
      const dx=stick.x-stick.sx,dy=stick.y-stick.sy,m=Math.hypot(dx,dy);
      if(m>10){const k=Math.min(m,70)/70;ax+=dx/m*k;ay+=dy/m*k;}
    }
    if(touchDash){dash=true;touchDash=false;}
  }else{
    if(keys.ArrowLeft)ax--;if(keys.ArrowRight)ax++;if(keys.ArrowUp)ay--;if(keys.ArrowDown)ay++;
    dash=!!(pressed.Enter||pressed.ShiftRight||pressed.Numpad0||pressed.Slash);
  }
  const pd=pads[p.i];
  if(pd){
    if(Math.abs(pd.ax)>.2)ax+=pd.ax;if(Math.abs(pd.ay)>.2)ay+=pd.ay;
    if(pd.b[14])ax--;if(pd.b[15])ax++;if(pd.b[12])ay--;if(pd.b[13])ay++;
    if(pd.e[0]||pd.e[5]||pd.e[7])dash=true;
  }
  const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;}
  return {ax,ay,dash};
}

/* ---------------- game data ---------------- */
let state='menu',prevState='play',nP=1,t=0,shake=0,score=0,combo=0,comboT=0,kills=0,wave=0,phase='banner',banner=0,clearT=0,spawnCd=0;
let xp=0,lvl=1,xpNeed=5,pend=0,choices=[],lvlLock=0,overT=-1,magnetAll=0,streak=0,streakT=0,best=0,newBest=false,queue=[];
let players=[],enemies=[],bullets=[],ebul=[],gems=[],parts=[],texts=[],picks=[],rings=[];
let up={},upN={};
const ET={
  swarm:{r:9,hp:12,sp:165,dmg:10,col:'#ffe14a',xp:1,pts:10},
  grunt:{r:14,hp:34,sp:100,dmg:15,col:'#ff4a5e',xp:1,pts:20},
  shoot:{r:13,hp:28,sp:75,dmg:12,col:'#b46bff',xp:2,pts:40},
  tank:{r:27,hp:210,sp:55,dmg:25,col:'#ff8a2b',xp:6,pts:100},
  split:{r:17,hp:52,sp:85,dmg:15,col:'#3dff9a',xp:2,pts:50},
  dash:{r:12,hp:26,sp:90,dmg:18,col:'#ff5cf0',xp:2,pts:45},
  boss:{r:50,hp:1200,sp:48,dmg:30,col:'#ff2d6f',xp:40,pts:1500}
};
const UPS=[
  {id:'dmg',name:'HEAVY ROUNDS',desc:'+30% bullet damage',max:8,icon:'💥',f(){up.dmg+=.3;}},
  {id:'rate',name:'RAPID FIRE',desc:'+25% fire rate',max:8,icon:'⚡',f(){up.rate+=.25;}},
  {id:'multi',name:'TRIPLE THREAT',desc:'+1 extra projectile per shot',max:4,icon:'🔱',f(){up.multi+=1;}},
  {id:'pierce',name:'PIERCER',desc:'Bullets slice through +1 enemy',max:4,icon:'🏹',f(){up.pierce+=1;}},
  {id:'spd',name:'TURBO BOOTS',desc:'+12% move speed',max:5,icon:'👟',f(){up.spd+=.12;}},
  {id:'magnet',name:'GEM MAGNET',desc:'+50% pickup range',max:4,icon:'🧲',f(){up.magnet+=.5;}},
  {id:'orbit',name:'DEATH BLADES',desc:'+1 blade spinning around you',max:5,icon:'🌀',f(){up.orbit+=1;}},
  {id:'nova',name:'NOVA PULSE',desc:'Shockwave blasts enemies away',max:4,icon:'☄️',f(){up.nova+=1;}},
  {id:'explode',name:'BOOM ROUNDS',desc:'Bullets explode on impact',max:3,icon:'🧨',f(){up.explode+=1;}},
  {id:'dash',name:'PHASE DASH',desc:'Dash recharges 25% faster',max:4,icon:'💨',f(){up.dashcd*=.75;}},
  {id:'hp',name:'IRON HEART',desc:'+25 max HP and full heal',max:5,icon:'❤️',f(){players.forEach(p=>{p.max+=25;if(!p.down)p.hp=p.max;});}},
  {id:'regen',name:'NANOBOTS',desc:'Slowly regenerate health',max:3,icon:'🩹',f(){up.regen+=1;}}
];

function mkP(i){
  return {i,x:nP===1?W/2:W/2+(i?90:-90),y:H/2,vx:0,vy:0,r:14,hp:100,max:100,col:i?'#ff3df2':'#27f0ff',
    inv:0,dash:0,dx:1,dy:0,dcd:0,fcd:0,nt:2,down:false,rev:0,aim:null};
}
function newGame(n){
  nP=n;players=[mkP(0)];if(n===2)players.push(mkP(1));
  enemies=[];bullets=[];ebul=[];gems=[];parts=[];texts=[];picks=[];rings=[];
  score=0;combo=0;comboT=0;kills=0;wave=0;xp=0;lvl=1;xpNeed=5;pend=0;t=0;shake=0;overT=-1;magnetAll=0;streak=0;
  up={dmg:1,rate:1,multi:1,pierce:0,spd:1,magnet:1,orbit:0,nova:0,explode:0,dashcd:1,regen:0};upN={};
  best=loadBest(n);newBest=false;stick=null;
  state='play';startWave();
}

/* ---------------- helpers ---------------- */
function burst(x,y,col,n,spd,life,sz){
  if(parts.length>650)return;
  for(let i=0;i<n;i++){const a=R(0,TAU),s=R(.2,1)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*R(.6,1.2),max:life,col,sz:sz*R(.6,1.2)});}
}
function floatText(x,y,txt,col,sz,life){texts.push({x,y,txt,col,sz,life:life||.8,max:life||.8,vy:-40});}
function ring(x,y,max,col,dmg,speed){rings.push({x,y,r:8,max,col,dmg,hit:[],speed:speed||620});}
function alive(){return players.filter(p=>!p.down);}
function nearestPlayer(x,y){let b=null,bd=1e9;for(const p of players){if(p.down)continue;const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;b=p;}}return b;}
function nearestEnemy(x,y,maxD){let b=null,bd=maxD*maxD;for(const e of enemies){if(e.dead||e.spawnT>0)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e;}}return b;}
function setPause(on){
  if(on&&state==='play'){state='pause';}
  else if(!on&&state==='pause'){state='play';}
}

/* ---------------- waves ---------------- */
function startWave(){
  wave++;phase='banner';banner=2.3;spawnCd=0;sfx.wave();
  let budget=8+wave*5+(nP-1)*(4+wave*2);
  const pool=[['swarm',1,1],['grunt',2,1],['shoot',3,3],['split',3,4],['dash',3,5],['tank',6,6]];
  const av=pool.filter(x=>wave>=x[2]);
  const q=[];
  const boss=wave%5===0;
  if(boss)budget*=.45;
  while(budget>0){
    const opts=av.filter(x=>x[1]<=budget);if(!opts.length)break;
    const c=opts[Math.floor(Math.random()*opts.length)];q.push(c[0]);budget-=c[1];
  }
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
  if(boss)q.unshift('boss');
  queue=q;
}
function spawnFromQueue(){
  const type=queue.shift();let x=0,y=0;
  for(let n=0;n<14;n++){
    x=R(AX0+50,AX1-50);y=R(AY0+50,AY1-50);
    if(type==='boss'){x=W/2;y=AY0+90;break;}
    if(alive().every(p=>Math.hypot(p.x-x,p.y-y)>260))break;
  }
  spawnE(type,x,y,true);
}
function spawnE(type,x,y,tele){
  const d=ET[type];
  const hs=(1+(wave-1)*.13)*(1+.5*(nP-1))*(type==='boss'?1+Math.floor(wave/5-1)*.6:1);
  enemies.push({type,x,y,vx:0,vy:0,r:d.r,hp:d.hp*hs,max:d.hp*hs,spawnT:tele?.9:0,fl:0,t:R(0,9),ob:0,cd:R(.8,2),st:0,ang:0,sd:Math.random()<.5?1:-1,boss:type==='boss',rot:0});
}
function waveClear(){
  phase='clear';clearT=2.4;magnetAll=2.4;sfx.clear();
  const bonus=wave*100;score+=bonus;
  floatText(W/2,H/2-30,'WAVE '+wave+' CLEARED  +'+bonus,'#7dffb0',34,1.8);
  ebul=[];
  for(const p of players){
    if(p.down){p.down=false;p.hp=p.max*.5;p.inv=1.5;p.rev=0;burst(p.x,p.y,p.col,30,260,.6,4);sfx.revive();}
    else p.hp=Math.min(p.max,p.hp+p.max*.25);
  }
}

/* ---------------- combat ---------------- */
function hurtE(e,dmg,kx,ky){
  if(e.dead||e.spawnT>0)return;
  e.hp-=dmg;e.fl=.08;
  if(kx||ky){const k=e.boss?.15:e.type==='tank'?.5:1;e.vx+=kx*k;e.vy+=ky*k;}
  if(e.hp<=0)killE(e);else sfx.hit();
}
function killE(e){
  if(e.dead)return;
  e.dead=true;kills++;
  const d=ET[e.type];
  burst(e.x,e.y,d.col,e.boss?90:14,e.boss?420:220,.55,e.boss?6:3);
  ring(e.x,e.y,e.r*2.4,d.col,0,420);
  sfx.kill();
  // score + combo
  combo++;comboT=3;
  const mult=1+Math.floor(combo/8)*.5,g=Math.round(d.pts*mult);score+=g;
  if(d.pts>=40)floatText(e.x,e.y-e.r,'+'+g,d.col,16,.7);
  if(combo===10||combo===25||combo===50||combo===100||combo===200)floatText(W/2,AY0+120,combo+' COMBO!','#ffe14a',44,1.3);
  // loot
  const n=e.boss?10:1;
  for(let i=0;i<n;i++)gems.push({x:e.x+R(-8,8),y:e.y+R(-8,8),v:e.boss?4:d.xp,vx:R(-120,120),vy:R(-120,120),a:R(0,TAU)});
  const roll=Math.random();
  if(e.boss){picks.push({x:e.x,y:e.y,type:'heart',t:0});shake=Math.max(shake,30);sfx.boom();ebul=[];ring(e.x,e.y,420,'#ff2d6f',0,500);}
  else if(roll<.025)picks.push({x:e.x,y:e.y,type:'heart',t:0});
  else if(roll<.034)picks.push({x:e.x,y:e.y,type:'bomb',t:0});
  if(e.type==='split'){for(let i=0;i<2;i++){spawnE('swarm',e.x+(i?14:-14),e.y,false);const s=enemies[enemies.length-1];s.vx=(i?1:-1)*200;s.vy=R(-100,100);}}
}
function blast(x,y,r,dmg){
  ring(x,y,r,'#ffb347',0,520);burst(x,y,'#ffb347',12,230,.4,3);sfx.boom();
  for(const e of enemies){
    if(e.dead||e.spawnT>0)continue;
    const d=Math.hypot(e.x-x,e.y-y);if(d<r+e.r){const a=Math.atan2(e.y-y,e.x-x);hurtE(e,dmg,Math.cos(a)*180,Math.sin(a)*180);}
  }
}
function hurtP(p,d,nx,ny){
  if(p.inv>0||p.down||p.dash>0)return;
  p.hp-=d;p.inv=1;combo=0;comboT=0;shake=Math.max(shake,14);
  p.vx+=nx*420;p.vy+=ny*420;
  burst(p.x,p.y,p.col,18,260,.5,3);sfx.hurt();
  if(p.hp<=0){
    p.hp=0;p.down=true;p.rev=0;burst(p.x,p.y,p.col,50,360,.8,4);sfx.down();
    if(!players.some(q=>!q.down))overT=1.3;
  }
}
function shoot(p,e){
  const a=Math.atan2(e.y-p.y,e.x-p.x);p.aim=a;
  const n=up.multi;
  for(let k=0;k<n;k++){
    const an=a+(k-(n-1)/2)*.15+R(-.015,.015);
    bullets.push({x:p.x+Math.cos(an)*18,y:p.y+Math.sin(an)*18,vx:Math.cos(an)*780,vy:Math.sin(an)*780,dmg:10*up.dmg,pi:up.pierce,life:.85,col:p.col,h:[],r:5});
  }
  p.fcd=.3/up.rate;sfx.shoot();
}
function bladePos(p,k){const a=t*4.2+k*TAU/up.orbit;return {x:p.x+Math.cos(a)*62,y:p.y+Math.sin(a)*62,a};}

/* ---------------- update ---------------- */
function update(dt){
  t+=dt;
  if(shake>0)shake*=Math.exp(-9*dt);
  /* players */
  for(const p of players){
    p.inv-=dt;p.dcd-=dt;p.fcd-=dt;
    if(p.down){
      const o=players.find(q=>q!==p&&!q.down);
      if(o&&Math.hypot(o.x-p.x,o.y-p.y)<80){p.rev+=dt/2.2;if(p.rev>=1){p.down=false;p.hp=p.max*.5;p.inv=1.5;p.rev=0;burst(p.x,p.y,p.col,30,260,.6,4);sfx.revive();floatText(p.x,p.y-30,'REVIVED!',p.col,22,1);}}
      else p.rev=Math.max(0,p.rev-dt*.6);
      continue;
    }
    const inp=getInput(p);
    const spd=270*up.spd;
    if(inp.ax||inp.ay){const m=Math.hypot(inp.ax,inp.ay);p.dx=inp.ax/m;p.dy=inp.ay/m;}
    if(inp.dash&&p.dcd<=0&&p.dash<=0){p.dash=.17;p.dcd=1.3*up.dashcd;p.inv=Math.max(p.inv,.3);sfx.dash();burst(p.x,p.y,p.col,16,200,.35,3);}
    if(p.dash>0){
      p.dash-=dt;p.vx=p.dx*900;p.vy=p.dy*900;
      parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.28,max:.28,col:p.col,sz:p.r*.95});
    }else{
      const k=1-Math.exp(-14*dt);p.vx+=(inp.ax*spd-p.vx)*k;p.vy+=(inp.ay*spd-p.vy)*k;
    }
    p.x=clamp(p.x+p.vx*dt,AX0+p.r,AX1-p.r);p.y=clamp(p.y+p.vy*dt,AY0+p.r,AY1-p.r);
    if(up.regen)p.hp=Math.min(p.max,p.hp+up.regen*1.3*dt);
    if(p.fcd<=0){const e=nearestEnemy(p.x,p.y,580);if(e)shoot(p,e);else p.aim=null;}
    if(up.nova){p.nt-=dt;if(p.nt<=0){p.nt=Math.max(1.8,6-up.nova*1);ring(p.x,p.y,150+up.nova*35,p.col,22*up.dmg,560);sfx.nova();}}
  }
  /* rings (nova + visuals) */
  for(const g of rings){
    g.r+=g.speed*dt;
    if(g.dmg>0)for(const e of enemies){
      if(e.dead||e.spawnT>0||g.hit.includes(e))continue;
      const d=Math.hypot(e.x-g.x,e.y-g.y);
      if(Math.abs(d-g.r)<e.r+14){g.hit.push(e);const a=Math.atan2(e.y-g.y,e.x-g.x);hurtE(e,g.dmg,Math.cos(a)*420,Math.sin(a)*420);}
    }
  }
  rings=rings.filter(g=>g.r<g.max);
  /* orbit blades */
  if(up.orbit)for(const p of players){
    if(p.down)continue;
    for(let k=0;k<up.orbit;k++){
      const b=bladePos(p,k);
      for(const e of enemies){
        if(e.dead||e.spawnT>0||e.ob>0)continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+13){e.ob=.3;hurtE(e,16*up.dmg,Math.cos(b.a)*160,Math.sin(b.a)*160);burst(b.x,b.y,'#fff',3,120,.2,2);}
      }
    }
  }
  /* bullets */
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<AX0||b.x>AX1||b.y<AY0||b.y>AY1){b.dead=true;burst(b.x,b.y,b.col,3,90,.2,2);continue;}
    for(const e of enemies){
      if(e.dead||e.spawnT>0||b.h.includes(e))continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        b.h.push(e);const sp=Math.hypot(b.vx,b.vy);
        hurtE(e,b.dmg,b.vx/sp*90,b.vy/sp*90);burst(b.x,b.y,'#fff',3,120,.18,2);
        if(b.pi--<=0){b.dead=true;if(up.explode)blast(b.x,b.y,38+up.explode*22,b.dmg*.6);break;}
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  /* enemies */
  for(const e of enemies){
    if(e.dead)continue;
    e.t+=dt;e.fl-=dt;e.ob-=dt;
    if(e.spawnT>0){e.spawnT-=dt;continue;}
    const tg=nearestPlayer(e.x,e.y);if(!tg)continue;
    let dx=tg.x-e.x,dy=tg.y-e.y;const dist=Math.hypot(dx,dy)||1;dx/=dist;dy/=dist;
    e.ang=Math.atan2(dy,dx);
    const d=ET[e.type];let tvx=dx*d.sp,tvy=dy*d.sp,k=1-Math.exp(-5*dt);
    if(e.type==='shoot'){
      if(dist<230){tvx=-dx*d.sp;tvy=-dy*d.sp;}
      else if(dist<320){tvx=-dy*e.sd*d.sp*.8;tvy=dx*e.sd*d.sp*.8;}
      e.cd-=dt;
      if(e.cd<=0&&dist<760){
        e.cd=R(1.6,2.4)*Math.max(.6,1-wave*.02);
        ebul.push({x:e.x,y:e.y,vx:dx*290,vy:dy*290,r:6,dmg:12,life:4});
      }
    }else if(e.type==='dash'){
      e.cd-=dt;
      if(e.st===0){if(e.cd<=0){e.st=1;e.cd=.65;}}
      else if(e.st===1){tvx=tvy=0;if(e.cd<=0){e.st=2;e.cd=.5;e.lx=dx;e.ly=dy;}}
      else{tvx=e.lx*620;tvy=e.ly*620;k=1;if(e.cd<=0){e.st=0;e.cd=R(1.4,2.4);}}
    }else if(e.type==='boss'){
      e.cd-=dt;e.rot+=dt*.8;
      const rage=e.hp<e.max*.5,pace=rage?1.25:1;
      tvx*=pace;tvy*=pace;
      if(e.cd<=0){
        e.cd=rage?1.5:2.1;e.st++;
        const n=rage?18:12;
        for(let i=0;i<n;i++){const a=e.rot+i*TAU/n;ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,r:7,dmg:15,life:5});}
        if(e.st%2===0){for(let i=-2;i<=2;i++){const a=e.ang+i*.2;ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*340,vy:Math.sin(a)*340,r:7,dmg:15,life:4});}}
        sfx.boom();shake=Math.max(shake,6);
      }
      e.cd2=(e.cd2===undefined?5:e.cd2)-dt;
      if(e.cd2<=0){e.cd2=rage?5:7;for(let i=0;i<(rage?7:5);i++){const a=i*TAU/6;spawnE('swarm',e.x+Math.cos(a)*80,e.y+Math.sin(a)*80,true);}}
    }
    e.vx+=(tvx-e.vx)*k;e.vy+=(tvy-e.vy)*k;
    e.x=clamp(e.x+e.vx*dt,AX0+e.r,AX1-e.r);e.y=clamp(e.y+e.vy*dt,AY0+e.r,AY1-e.r);
    for(const p of players){
      if(p.down)continue;
      const pd=Math.hypot(p.x-e.x,p.y-e.y);
      if(pd<e.r+p.r)hurtP(p,d.dmg,(p.x-e.x)/(pd||1),(p.y-e.y)/(pd||1));
    }
  }
  /* soft separation */
  for(let i=0;i<enemies.length;i++){
    const a=enemies[i];if(a.dead||a.spawnT>0)continue;
    for(let j=i+1;j<enemies.length;j++){
      const b=enemies[j];if(b.dead||b.spawnT>0)continue;
      const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2<m*m&&d2>.01){
        const d=Math.sqrt(d2),push=(m-d)*.5,nx=dx/d,ny=dy/d,wa=b.r/(a.r+b.r),wb=a.r/(a.r+b.r);
        a.x-=nx*push*wa*2;a.y-=ny*push*wa*2;b.x+=nx*push*wb*2;b.y+=ny*push*wb*2;
      }
    }
  }
  enemies=enemies.filter(e=>!e.dead);
  /* enemy bullets */
  for(const b of ebul){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<AX0-20||b.x>AX1+20||b.y<AY0-20||b.y>AY1+20){b.dead=true;continue;}
    for(const p of players){
      if(p.down)continue;
      if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){
        const m=Math.hypot(b.vx,b.vy);
        if(p.inv<=0&&p.dash<=0){b.dead=true;hurtP(p,b.dmg,b.vx/m,b.vy/m);}
      }
    }
  }
  ebul=ebul.filter(b=>!b.dead);
  /* gems */
  if(magnetAll>0)magnetAll-=dt;
  if(streakT>0){streakT-=dt;if(streakT<=0)streak=0;}
  for(const g of gems){
    g.vx*=Math.exp(-4*dt);g.vy*=Math.exp(-4*dt);g.a+=dt*3;
    const p=nearestPlayer(g.x,g.y);
    if(p){
      const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy);
      if(d<130*up.magnet||magnetAll>0){const s=(magnetAll>0?900:520)+Math.max(0,300-d)*2;g.vx+=dx/d*s*dt*4;g.vy+=dy/d*s*dt*4;const m=Math.hypot(g.vx,g.vy);if(m>s){g.vx*=s/m;g.vy*=s/m;}}
      if(d<p.r+10){g.dead=true;streak++;streakT=.6;sfx.gem();gainXp(g.v);}
    }
    g.x=clamp(g.x+g.vx*dt,AX0,AX1);g.y=clamp(g.y+g.vy*dt,AY0,AY1);
  }
  gems=gems.filter(g=>!g.dead);
  /* pickups */
  for(const k of picks){
    k.t+=dt;
    for(const p of players){
      if(p.down||k.dead)continue;
      if(Math.hypot(p.x-k.x,p.y-k.y)<p.r+18){
        k.dead=true;sfx.pick();
        if(k.type==='heart'){for(const q of players)if(!q.down)q.hp=Math.min(q.max,q.hp+35);floatText(k.x,k.y-20,'+HEALTH','#ff6b8a',20,1);burst(k.x,k.y,'#ff6b8a',20,200,.5,3);}
        else{ring(k.x,k.y,1100,'#ffb347',0,1500);shake=Math.max(shake,26);sfx.boom();floatText(k.x,k.y-20,'BOOM!','#ffb347',28,1);
          for(const e of enemies)hurtE(e,e.boss?150:99999,0,0);ebul=[];}
      }
    }
    if(k.t>14)k.dead=true;
  }
  picks=picks.filter(k=>!k.dead);
  /* waves */
  if(phase==='banner'){banner-=dt;if(banner<=0)phase='fight';}
  else if(phase==='fight'){
    spawnCd-=dt;
    if(queue.length&&spawnCd<=0){spawnFromQueue();spawnCd=Math.max(.1,.55-wave*.025);}
    if(!queue.length&&!enemies.length)waveClear();
  }else if(phase==='clear'){clearT-=dt;if(clearT<=0)startWave();}
  /* combo + fx */
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.exp(-3*dt);q.vy*=Math.exp(-3*dt);q.life-=dt;}
  parts=parts.filter(q=>q.life>0);
  for(const q of texts){q.y+=q.vy*dt;q.life-=dt;}
  texts=texts.filter(q=>q.life>0);
}
function gainXp(v){
  xp+=v;
  while(xp>=xpNeed){xp-=xpNeed;lvl++;xpNeed=Math.round(xpNeed*1.28+2);pend++;}
  if(pend>0&&state==='play')openLevel();
}
function openLevel(){
  pend--;state='levelup';lvlLock=.5;sfx.level();
  const pool=UPS.filter(u=>(upN[u.id]||0)<u.max);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  choices=pool.slice(0,3);
  if(!choices.length){state='play';}
}
function choose(i){
  if(state!=='levelup'||lvlLock>0||!choices[i])return;
  const u=choices[i];u.f();upN[u.id]=(upN[u.id]||0)+1;sfx.pick();
  for(const p of players)if(!p.down)burst(p.x,p.y,'#ffe14a',24,240,.6,3);
  if(pend>0)openLevel();else state='play';
}
function endGame(){
  state='over';
  if(score>best){newBest=true;best=score;saveBest(nP,score);}
}

/* ---------------- global key/UI handling ---------------- */
function handleKeys(){
  if(pressed.KeyM){muted=!muted;if(master)master.gain.value=muted?0:.55;}
  if(state==='menu'){
    if(pressed.Digit1||pressed.Numpad1||pressed.Enter||pressed.Space)newGame(1);
    else if(pressed.Digit2||pressed.Numpad2)newGame(2);
    else if(padAny(0))newGame(pads.length>=2?2:1);
  }else if(state==='play'){
    if(pressed.KeyP||pressed.Escape||padAny(9))setPause(true);
  }else if(state==='pause'){
    if(pressed.KeyP||pressed.Escape||pressed.Enter||pressed.Space||padAny(9)||padAny(0))setPause(false);
    else if(pressed.KeyQ)state='menu';
  }else if(state==='levelup'){
    if(pressed.Digit1||pressed.Numpad1||padAny(0))choose(0);
    else if(pressed.Digit2||pressed.Numpad2||padAny(1))choose(1);
    else if(pressed.Digit3||pressed.Numpad3||padAny(2))choose(2);
  }else if(state==='over'){
    if(pressed.Enter||pressed.Space||pressed.KeyR||padAny(0))newGame(nP);
    else if(pressed.Escape||padAny(1))state='menu';
  }
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawEnemy(e){
  const d=ET[e.type];
  if(e.spawnT>0){
    const k=1-e.spawnT/.9;
    ctx.globalAlpha=.25+.6*k;ctx.strokeStyle=d.col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*(2.6-1.6*k),0,TAU);ctx.stroke();
    ctx.globalAlpha=.15*k;ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.fill();ctx.globalAlpha=1;return;
  }
  let col=e.fl>0?'#fff':d.col;

  ctx.globalAlpha=.13;ctx.fillStyle=col;ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.9,0,TAU);ctx.fill();
  ctx.globalAlpha=.3;ctx.fillStyle=col;
  const x=e.x,y=e.y,r=e.r;
  const shape=()=>{
    switch(e.type){
      case 'swarm':poly(x,y,r*1.15,4,e.t*3);break;
      case 'grunt':poly(x,y,r*1.2,4,Math.PI/4+Math.sin(e.t*3)*.25);break;
      case 'shoot':poly(x,y,r*1.3,3,e.ang);break;
      case 'tank':poly(x,y,r,6,e.t*.4);break;

      case 'dash':poly(x,y,r*1.5,3,e.st===2?Math.atan2(e.ly,e.lx):e.ang);break;

  if(e.type==='tank'){ctx.lineWidth=2;poly(x,y,r*.55,6,-e.t);ctx.stroke();}
  if(e.type==='split'){ctx.lineWidth=2;for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(x+(i?7:-7),y,5,0,TAU);ctx.stroke();}}
  if(e.boss){ctx.lineWidth=3;poly(x,y,r*.6,8,-e.rot*1.5);ctx.stroke();for(let i=0;i<8;i++){const a=e.rot*2+i*TAU/8;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.lineTo(x+Math.cos(a)*(r+16),y+Math.sin(a)*(r+16));ctx.stroke();}}

}
function drawPlayer(p){
  const c=p.col;
  if(p.down){
    ctx.globalAlpha=.5;ctx.strokeStyle='#888';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    if(p.rev>0){ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+10,-Math.PI/2,-Math.PI/2+TAU*p.rev);ctx.stroke();}

  }

  ctx.globalAlpha=a0*.28;ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.7,0,TAU);ctx.fill();
  ctx.globalAlpha=a0;ctx.fillStyle='#0b0618';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  ctx.strokeStyle=c;ctx.lineWidth=3.5;ctx.stroke();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*.45,0,TAU);ctx.fill();
  if(p.aim!=null){ctx.beginPath();const a=p.aim;ctx.moveTo(p.x+Math.cos(a)*(p.r+10),p.y+Math.sin(a)*(p.r+10));ctx.lineTo(p.x+Math.cos(a+2.6)*(p.r+1),p.y+Math.sin(a+2.6)*(p.r+1));ctx.lineTo(p.x+Math.cos(a-2.6)*(p.r+1),p.y+Math.sin(a-2.6)*(p.r+1));ctx.closePath();ctx.fill();}
  ctx.globalAlpha=1;
  if(players.length>1)txt('P'+(p.i+1),p.x,p.y-p.r-14,13,c);
  if(p.dcd>0){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r+5,-Math.PI/2,-Math.PI/2+TAU*(1-p.dcd/(1.3*up.dashcd)));ctx.stroke();}
}
function drawWorld(){
  ctx.drawImage(bg,0,0);
  const pulse=AC&&AC.currentTime>=pulseAt?Math.max(0,1-(AC.currentTime-pulseAt)*5):0;
  const hue=(t*30)%360;
  ctx.strokeStyle='hsl('+hue+',100%,65%)';ctx.lineWidth=3+pulse*3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=14+pulse*18;
  ctx.strokeRect(AX0,AY0,AX1-AX0,AY1-AY0);ctx.shadowBlur=0;
  if(pulse>0){ctx.globalAlpha=pulse*.06;ctx.fillStyle='#8a6bff';ctx.fillRect(AX0,AY0,AX1-AX0,AY1-AY0);ctx.globalAlpha=1;}
  for(const g of gems){
    const s=3+Math.sin(g.a)*.8+Math.min(g.v,6)*.4;
    ctx.globalAlpha=.25;ctx.fillStyle='#5df2ff';ctx.beginPath();ctx.arc(g.x,g.y,s*2.4,0,TAU);ctx.fill();
    ctx.globalAlpha=1;poly(g.x,g.y,s*1.5,4,g.a);ctx.fillStyle='#b8fbff';ctx.fill();
  }
  for(const k of picks){
    const bob=Math.sin(k.t*4)*4;
    ctx.globalAlpha=.25;ctx.fillStyle=k.type==='heart'?'#ff6b8a':'#ffb347';ctx.beginPath();ctx.arc(k.x,k.y+bob,26,0,TAU);ctx.fill();ctx.globalAlpha=k.t>11&&Math.floor(t*10)%2?.3:1;
    txt(k.type==='heart'?'❤️':'💣',k.x,k.y+bob,30,'#fff');ctx.globalAlpha=1;
  }
  for(const g of rings){ctx.globalAlpha=Math.max(0,1-g.r/g.max)*.9;ctx.strokeStyle=g.col;ctx.lineWidth=g.dmg>0?10:5;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const e of enemies)drawEnemy(e);
  for(const b of ebul){
    ctx.globalAlpha=.3;ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.4,0,TAU);ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fillStyle='#ffd0d8';ctx.fill();ctx.strokeStyle='#ff4d6d';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.globalCompositeOperation='lighter';
  for(const b of bullets){
    ctx.globalAlpha=.3;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r*3,0,TAU);ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle=b.col;ctx.lineWidth=b.r*1.2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.7,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  if(up.orbit)for(const p of players){
    if(p.down)continue;
    for(let k=0;k<up.orbit;k++){
      const b=bladePos(p,k);
      ctx.globalAlpha=.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,20,0,TAU);ctx.fill();ctx.globalAlpha=1;
      poly(b.x,b.y,13,3,b.a+t*10);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.stroke();
    }
  }
  for(const p of players)drawPlayer(p);
  ctx.globalCompositeOperation='lighter';
  for(const q of parts){const a=q.life/q.max;ctx.globalAlpha=Math.max(0,Math.min(1,a));ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.5,q.sz*(.4+a*.6)),0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(const q of texts){ctx.globalAlpha=Math.min(1,q.life/q.max*2);txt(q.txt,q.x,q.y,q.sz,q.col,'center',10);}
  ctx.globalAlpha=1;
}
function hpBar(p,x,y,w,right){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y,w,14);
  const f=p.hp/p.max;ctx.fillStyle=f>.3?p.col:'#ff4a5e';ctx.fillRect(x,y,w*f,14);
  ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.strokeRect(x,y,w,14);
  txt((players.length>1?'P'+(p.i+1)+'  ':'HP  ')+Math.ceil(p.hp)+'/'+p.max,right?x+w:x,y+30,13,p.col,right?'right':'left');
}
function drawHUD(){
  ctx.fillStyle='rgba(5,3,14,.7)';ctx.fillRect(0,0,W,AY0-10);
  hpBar(players[0],30,14,230,false);
  if(players[1])hpBar(players[1],W-350,14,230,true);
  txt(String(score).padStart(7,'0'),W/2,26,34,'#fff','center',14);
  const mult=1+Math.floor(combo/8)*.5;
  txt('WAVE '+wave+'   ·   LV '+lvl+(combo>=3?'   ·   COMBO '+combo+(mult>1?' ×'+mult.toFixed(1):''):''),W/2,54,15,combo>=8?'#ffe14a':'#9a8cff');
  // xp bar
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(AX0,H-18,AX1-AX0,8);
  const g=ctx.createLinearGradient(AX0,0,AX1,0);g.addColorStop(0,'#27f0ff');g.addColorStop(1,'#ff3df2');
  ctx.fillStyle=g;ctx.fillRect(AX0,H-18,(AX1-AX0)*xp/xpNeed,8);
  // boss bar
  const boss=enemies.find(e=>e.boss&&e.spawnT<=0);
  if(boss){
    const bw=560,bx=(W-bw)/2,by=AY0+12;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by,bw,14);ctx.fillStyle='#ff2d6f';ctx.fillRect(bx,by,bw*Math.max(0,boss.hp/boss.max),14);
    ctx.strokeStyle='#ff2d6f';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,14);txt('☠ OVERLORD ☠',W/2,by+30,14,'#ff9db5');
  }
  // banner
  if(phase==='banner'&&banner>0){
    const a=Math.min(1,banner/.5,(2.3-banner)/.3+.0);
    ctx.globalAlpha=clamp(a,0,1);
    const isBoss=wave%5===0;
    txt(isBoss?'BOSS WAVE '+wave:'WAVE '+wave,W/2,H/2-40,isBoss?64:72,isBoss?'#ff2d6f':'#27f0ff','center',30);
    txt(isBoss?'THE OVERLORD APPROACHES':(wave===1?'MOVE · DODGE · SURVIVE':'GET READY'),W/2,H/2+20,22,'#fff');
    ctx.globalAlpha=1;
  }
  // pause button
  button(W-62,12,40,40,'II',()=>setPause(true),'#9a8cff',18);
  // touch controls
  if(touchMode&&state==='play'){
    if(stick){
      ctx.globalAlpha=.35;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(stick.sx,stick.sy,70,0,TAU);ctx.stroke();
      const dx=stick.x-stick.sx,dy=stick.y-stick.sy,m=Math.min(70,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(stick.sx+Math.cos(a)*m,stick.sy+Math.sin(a)*m,28,0,TAU);ctx.fill();ctx.globalAlpha=1;
    }else txt('DRAG TO MOVE',W*.2,H-70,16,'rgba(255,255,255,.35)');
    txt('TAP HERE = DASH',W*.8,H-70,16,'rgba(255,255,255,.35)');
  }
}
function drawOverlayDim(a){ctx.fillStyle='rgba(4,2,12,'+a+')';ctx.fillRect(0,0,W,H);}

function drawMenu(dt){
  ctx.drawImage(bg,0,0);
  for(const s of menuShapes){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=dt*.5;
    if(s.x<-60)s.x=W+60;if(s.x>W+60)s.x=-60;if(s.y<-60)s.y=H+60;if(s.y>H+60)s.y=-60;
    ctx.globalAlpha=.5;ctx.strokeStyle=s.col;ctx.lineWidth=3;poly(s.x,s.y,s.r,s.n,s.rot);ctx.stroke();
    ctx.globalAlpha=.1;ctx.fillStyle=s.col;ctx.fill();
  }
  ctx.globalAlpha=1;
  const wob=Math.sin(t*2)*6;
  ctx.save();ctx.translate(W/2,150+wob);ctx.rotate(Math.sin(t*1.3)*.02);
  txt('NEON RIOT',3,3,118,'#ff3df2','center',0);
  txt('NEON RIOT',-3,-2,118,'#27f0ff','center',40);
  txt('NEON RIOT',0,0,118,'#fff','center',0);
  ctx.restore();
  txt('SURVIVE THE SWARM.  TOGETHER.',W/2,238,22,'#ffe14a','center',12);
  button(W/2-250,290,230,84,'1 PLAYER',()=>newGame(1),'#27f0ff',28);
  button(W/2+20,290,230,84,'2 PLAYERS',()=>newGame(2),'#ff3df2',28);
  txt(touchMode?'drag left side to move  ·  tap right side to dash':'press 1 or 2  ·  or ENTER',W/2,396,15,'#8f84d6');
  // controls card
  rr(W/2-380,430,760,200,18);ctx.fillStyle='rgba(12,8,34,.8)';ctx.fill();ctx.strokeStyle='#4a3fa8';ctx.lineWidth=2;ctx.stroke();
  txt('HOW TO PLAY',W/2,456,18,'#fff');
  txt('P1',W/2-340,500,22,'#27f0ff','left');txt('WASD to move  ·  SPACE to dash',W/2-290,500,17,'#cfc8ff','left');
  txt('P2',W/2-340,540,22,'#ff3df2','left');txt('ARROWS to move  ·  ENTER to dash',W/2-290,540,17,'#cfc8ff','left');
  txt('Your ship auto-aims and auto-fires. Collect gems, pick upgrades,',W/2,582,15,'#9a8cff');
  txt('revive your bro by standing next to them. Gamepads & touch work too!',W/2,606,15,'#9a8cff');
  const b1=loadBest(1),b2=loadBest(2);
  txt('BEST  1P: '+b1+'     2P: '+b2,W/2,665,16,'#ffe14a');
  txt(muted?'🔇 M':'🔊 M',W-50,30,16,'#9a8cff');
}
function drawLevelUp(){
  drawOverlayDim(.72);
  txt('LEVEL UP!',W/2,100,64,'#ffe14a','center',28);
  txt('Pick an upgrade'+(players.length>1?' (shared by both players)':''),W/2,158,20,'#cfc8ff');
  const cw=330,ch=360,gap=30,x0=(W-(cw*choices.length+gap*(choices.length-1)))/2,y0=200;
  choices.forEach((u,i)=>{
    const x=x0+i*(cw+gap),hov=mx>=x&&mx<=x+cw&&my>=y0&&my<=y0+ch;
    const lift=hov?-8:0;
    uiBtns.push({x,y:y0,w:cw,h:ch,fn:()=>choose(i)});
    rr(x,y0+lift,cw,ch,18);ctx.fillStyle=hov?'#1d1450':'#120b34';ctx.fill();
    const col=['#27f0ff','#ffe14a','#ff3df2'][i%3];
    ctx.strokeStyle=col;ctx.lineWidth=hov?5:3;ctx.shadowColor=col;ctx.shadowBlur=hov?28:12;ctx.stroke();ctx.shadowBlur=0;
    txt('['+(i+1)+']',x+cw/2,y0+34+lift,18,col);
    txt(u.icon,x+cw/2,y0+112+lift,78,'#fff');
    txt(u.name,x+cw/2,y0+195+lift,22,'#fff');
    wrap(u.desc,24).forEach((l,j)=>txt(l,x+cw/2,y0+240+j*26+lift,17,'#cfc8ff'));
    const n=upN[u.id]||0;
    for(let k=0;k<u.max;k++){ctx.fillStyle=k<n?col:'rgba(255,255,255,.15)';ctx.fillRect(x+cw/2-u.max*9+k*18,y0+ch-34+lift,14,8);}
  });
}
function drawPause(){
  drawOverlayDim(.7);
  txt('PAUSED',W/2,230,84,'#fff','center',30);
  button(W/2-150,320,300,76,'RESUME',()=>setPause(false),'#27f0ff',28);
  button(W/2-150,416,300,76,'QUIT TO MENU',()=>{state='menu';},'#ff3df2',24);
  txt('P / ESC resume  ·  Q quit  ·  M mute',W/2,540,16,'#9a8cff');
}
function drawOver(){
  drawOverlayDim(.78);
  txt('GAME OVER',W/2,130,92,'#ff2d6f','center',34);
  txt(String(score),W/2,235,72,'#fff','center',20);
  if(newBest)txt('★ NEW HIGH SCORE ★',W/2,296,28,'#ffe14a','center',18);
  else txt('BEST '+best,W/2,296,22,'#9a8cff');
  txt('WAVE '+wave+'    ·    LEVEL '+lvl+'    ·    '+kills+' KILLS',W/2,350,24,'#cfc8ff');
  if(nP===2)txt('Bros stick together. Try beating your record!',W/2,392,17,'#ff9df7');
  button(W/2-270,440,250,80,'PLAY AGAIN',()=>newGame(nP),'#27f0ff',26);
  button(W/2+20,440,250,80,'MENU',()=>{state='menu';},'#ff3df2',26);
  txt('ENTER = again  ·  ESC = menu',W/2,560,15,'#8f84d6');
}

function draw(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#07050f';ctx.fillRect(0,0,vw,vh);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  uiBtns=[];
  if(state==='menu')drawMenu(dt);
  else{
    ctx.save();
    if(shake>.3)ctx.translate(R(-shake,shake)*.6,R(-shake,shake)*.6);
    drawWorld();
    ctx.restore();
    drawHUD();
    if(state==='levelup')drawLevelUp();
    else if(state==='pause')drawPause();
    else if(state==='over')drawOver();
  }
  ctx.restore();
  if(vh>vw*1.1){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const fs=Math.max(13,Math.min(20,vw/22));
    ctx.fillStyle='rgba(255,225,74,.95)';ctx.font='900 '+fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('↻ TURN YOUR PHONE SIDEWAYS',vw/2,Math.max(24,oy/2-fs*.7));
    ctx.fillStyle='rgba(207,200,255,.9)';ctx.font='700 '+(fs*.75)+'px '+FONT;
    ctx.fillText('for a much bigger game',vw/2,Math.max(24,oy/2-fs*.7)+fs*1.4);
  }
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;
  pollPads();handleKeys();
  mi=state==='menu'||state==='over'?0:1+Math.min(Math.max(wave-1,0),9)/3;
  if(state==='menu'){t+=raw;}
  else if(state==='levelup'){lvlLock-=raw;t+=raw*.3;}
  else if(state==='play'){
    let dt=raw;
    if(overT>=0){overT-=raw;dt=raw*.35;if(overT<0)endGame();}
    if(state==='play')update(dt);
  }
  draw(raw);
  for(const k in pressed)pressed[k]=false;
  touchDash=false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// debug/test hook
window.__neon={get state(){return state;},newGame,get wave(){return wave;},get score(){return score;},players:()=>players,enemies:()=>enemies,
  levelUp(){gainXp(xpNeed);},setWave(n){wave=n-1;enemies=[];startWave();}};
})();
</script>
</body>
