<title>Face Fling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700;900&display=swap">
<style>
  /* Layout: full-bleed physics stage on canvas; chunky storybook panels float over it for menus, HUD pinned to the safe-area corners. */
  :root {
    --sky: #8fd3ff;
    --cream: #fff6df;
    --bark: #3b2412;
    --wood: #c98b4a;
    --orange: #ff7a1a;
    --germ: #74d64b;
    --gold: #ffc828;
    --muted: #8a6a4c;
    --font-display: "Secular One", "Rubik", system-ui, sans-serif;
    --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--sky);
    color: var(--bark);
    font-family: var(--font-body);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    pointer-events: none;
  }
  .hud[hidden] { display: none !important; }
  .score {
    font-family: var(--font-display);
    font-size: clamp(22px, 5vw, 34px);
    line-height: 1;
    color: #fff;
    -webkit-text-stroke: 1.5px var(--bark);
    paint-order: stroke fill;
    text-shadow: 0 3px 0 var(--bark);
    font-variant-numeric: tabular-nums;
  }
  .level-name { font-size: 14px; font-weight: 700; color: var(--bark); opacity: 0.75; margin-top: 4px; }
  .hud-buttons { display: flex; gap: 8px; pointer-events: auto; }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 14px;
    border: 3px solid var(--bark); background: var(--cream); color: var(--bark);
    box-shadow: 0 4px 0 var(--bark);
    font: 900 20px/1 var(--font-body);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bark); }
  .icon-btn:focus-visible, .btn:focus-visible, .lvl:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

  .overlay {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding-inline: 16px;
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: rgba(59, 36, 18, 0.35);
  }
  .overlay[hidden] { display: none !important; }
  .panel {
    width: min(420px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--cream);
    border: 4px solid var(--bark);
    border-radius: 26px;
    box-shadow: 0 8px 0 var(--bark);
    padding: 22px 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center;
  }
  .logo {
    font-family: var(--font-display);
    font-size: clamp(44px, 13vw, 72px);
    line-height: 0.95;
    color: var(--orange);
    -webkit-text-stroke: 3px var(--bark);
    paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--bark);
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .tagline { font-size: 17px; font-weight: 700; margin: 0; text-wrap: balance; }
  .cast { display: flex; justify-content: center; align-items: flex-end; gap: 18px; }
  .cast figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cast img { height: 92px; width: auto; filter: drop-shadow(0 4px 0 rgba(59, 36, 18, 0.35)); }
  .cast figcaption { font-size: 13px; font-weight: 700; color: var(--muted); }
  .btn {
    min-width: 180px; padding: 12px 22px;
    border-radius: 18px; border: 4px solid var(--bark);
    background: var(--orange); color: #fff;
    font: 400 24px/1.1 var(--font-display);
    -webkit-text-stroke: 1px var(--bark);
    box-shadow: 0 6px 0 var(--bark);
    cursor: pointer;
  }
  .btn.alt { background: var(--cream); color: var(--bark); -webkit-text-stroke: 0; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--bark); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 34ch; }
  .title { font-family: var(--font-display); font-size: 34px; margin: 0; line-height: 1; }

  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
  .lvl {
    aspect-ratio: 1; max-width: 100%;
    border-radius: 18px; border: 4px solid var(--bark);
    background: var(--wood); color: #fff;
    box-shadow: 0 5px 0 var(--bark);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font: 400 30px/1 var(--font-display);
    -webkit-text-stroke: 1px var(--bark);
    cursor: pointer;
  }
  .lvl small { font: 700 11px/1.1 var(--font-body); -webkit-text-stroke: 0; color: var(--cream); }
  .lvl .st { font-size: 15px; letter-spacing: 1px; -webkit-text-stroke: 0; color: var(--gold); text-shadow: 0 1px 0 var(--bark); }
  .lvl[disabled] { background: #a99a8a; cursor: default; }
  .lvl:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 2px 0 var(--bark); }

  .stars { display: flex; gap: 6px; justify-content: center; }
  .star { width: 58px; height: 58px; }
  .star path { fill: #d9cbb5; stroke: var(--bark); stroke-width: 3; stroke-linejoin: round; }
  .star.on path { fill: var(--gold); }
  .star.on { animation: pop 0.45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .big-score { font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  @keyframes pop { from { transform: scale(0.2) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
  @media (prefers-reduced-motion: reduce) { .star.on { animation: none; } }
</style>

<canvas id="stage" tabindex="0" aria-label="Face Fling: pull the character back from the slingshot and let go to launch"></canvas>

<div class="hud" id="hud" hidden>
  <div>
    <div class="score" id="score">0</div>
    <div class="level-name" id="levelName"></div>
  </div>
  <div class="hud-buttons">
    <button class="icon-btn" id="btnRestart" type="button" aria-label="התחל שלב מחדש">↻</button>
    <button class="icon-btn" id="btnPause" type="button" aria-label="השהיה">II</button>
  </div>
</div>

<div class="overlay" id="menu" dir="rtl">
  <div class="panel">
    <div class="logo" dir="ltr">FACE<br>FLING</div>
    <p class="tagline">הפרצוף והגבס נגד החיידקים</p>
    <div class="cast">
      <figure><img src="__FACE__" alt="הפרצוף"><figcaption>הפרצוף · הקש באוויר ל-BLEH</figcaption></figure>
      <figure><img src="__FOOT__" alt="הגבס"><figcaption>הגבס · הקש באוויר לדריסה</figcaption></figure>
    </div>
    <button class="btn" id="btnPlay" type="button">שחק</button>
    <button class="btn alt" id="btnSound" type="button">צליל: פועל</button>
    <p class="hint">משוך את הדמות אחורה מהקלע ושחרר. גרור במקום אחר כדי להזיז את המצלמה. עדיף לשחק עם הטלפון לרוחב.</p>
  </div>
</div>

<div class="overlay" id="levelsScreen" dir="rtl" hidden>
  <div class="panel">
    <h2 class="title">בחר שלב</h2>
    <div class="levels" id="levelGrid"></div>
    <button class="btn alt" id="btnBackMenu" type="button">חזרה</button>
  </div>
</div>

<div class="overlay" id="pauseScreen" dir="rtl" hidden>
  <div class="panel">
    <h2 class="title">השהיה</h2>
    <button class="btn" id="btnResume" type="button">המשך</button>
    <div class="row">
      <button class="btn alt" id="btnPauseRestart" type="button">מחדש</button>
      <button class="btn alt" id="btnPauseLevels" type="button">שלבים</button>
    </div>
    <button class="btn alt" id="btnSound2" type="button">צליל: פועל</button>
  </div>
</div>

<div class="overlay" id="resultScreen" dir="rtl" hidden>
  <div class="panel">
    <h2 class="title" id="resultTitle">ניצחון!</h2>
    <div class="stars" id="stars" dir="ltr"></div>
    <div class="big-score" id="resultScore">0</div>
    <p class="hint" id="resultNote"></p>
    <div class="row">
      <button class="btn" id="btnNext" type="button">השלב הבא</button>
      <button class="btn alt" id="btnRetry" type="button">שוב</button>
      <button class="btn alt" id="btnResultLevels" type="button">שלבים</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
'use strict';
const { Engine, Bodies, Body, Composite, Events, Sleeping } = Matter;

// ======================================================================= world constants
const GROUND = 900;
const LEVEL_W = 2300;
const SLING_X = 320;
const SLING_Y = GROUND - 150;
const VMAX = 27;          // launch speed at full pull, px per physics step
const STEP = 1000 / 60;
const G_STEP = 0.001 * STEP * STEP; // gravity added to velocity per step (Matter's default scale)
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const FACE = 'face', FOOT = 'foot';
const MATS = {
  wood:  { density: 0.0018, friction: 0.8, hp: 300, points: 500,  fill: '#c98b4a', dark: '#7a4a1e', light: '#e2a96a' },
  glass: { density: 0.0012, friction: 0.5, hp: 110, points: 300,  fill: '#bfeaff', dark: '#4aa3cf', light: '#ffffff' },
  stone: { density: 0.004,  friction: 0.9, hp: 950, points: 1000, fill: '#a3a6ad', dark: '#5d6068', light: '#c9ccd2' },
};

const rnd = Math.random;
const rf = (a, b) => a + rnd() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

// ======================================================================= images
const imgFace = new Image(); imgFace.src = '__FACE__';
const imgFoot = new Image(); imgFoot.src = '__FOOT__';

// ======================================================================= storage
const store = {
  get(k, d) { try { const v = localStorage.getItem('facefling_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('facefling_' + k, JSON.stringify(v)); } catch (e) { /* unavailable */ } },
};
const save = { stars: store.get('stars', []), best: store.get('best', []), sound: store.get('sound', true) };

// ======================================================================= audio (all synthesised)
const RATE = 22050;
let actx = null, master = null, buffers = {}, musicSrc = null, active = 0;
const synth = (() => {
  const buf = (s) => new Float32Array(Math.floor(s * RATE));
  const noise = () => Math.random() * 2 - 1;
  const fr = (p) => p - Math.floor(p);
  const saw = (p) => 2 * fr(p) - 1;
  const tri = (p) => 1 - 4 * Math.abs(fr(p) - 0.5);
  const { exp, sin, PI, min, pow, tanh } = Math;
  const svf = () => { let low = 0, band = 0; return (x, fc, q) => { const f = 2 * sin(PI * fc / RATE); low += f * band; const high = x - low - q * band; band += f * high; return band; }; };
  return {
    stretch() { const d = 0.35, b = buf(d); let ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += (90 + 260 * t / d) / RATE; b[i] = saw(ph) * 0.18 * min(1, t * 30) * (1 - t / d) * (0.6 + 0.4 * sin(t * 90)); } return b; },
    launch() { const d = 0.5, b = buf(d), f = svf(); let ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += (500 + 1100 * t / d) / RATE; b[i] = (f(noise(), 600 + 2600 * t / d, 0.6) * 0.5 + sin(ph * 2 * PI) * 0.12) * min(1, t * 20) * pow(1 - t / d, 1.4); } return b; },
    bleh() {
      const d = 0.5, b = buf(d), f1 = svf(), f2 = svf(); let ph = 0;
      for (let i = 0; i < b.length; i++) {
        const t = i / RATE, f0 = (230 - 90 * t / d) * (1 + 0.06 * sin(t * 2 * PI * 7));
        ph += f0 / RATE;
        const src = saw(ph);
        const v = f1(src, 650, 0.25) * 0.9 + f2(src, 1750, 0.3) * 0.5;
        b[i] = tanh(v * 1.4) * 0.5 * min(1, t * 25) * min(1, (d - t) * 6);
      }
      return b;
    },
    stomp() { const d = 1.0, b = buf(d); let lp = 0, ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * (0.4 * exp(-t * 6) + 0.02); ph += (30 + 110 * exp(-t * 10)) / RATE; b[i] = tanh((lp * 1.8 + sin(ph * 2 * PI) * 1.2) * exp(-t * 3.2) * min(1, t * 300)) * 0.8; } return b; },
    wood() { const d = 0.16, b = buf(d); let ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += (210 - 120 * t / d) / RATE; b[i] = (sin(ph * 2 * PI) * 0.7 + noise() * 0.35 * exp(-t * 60)) * exp(-t * 28) * 0.7; } return b; },
    woodBreak() { const d = 0.45, b = buf(d); let lp = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * 0.25; const crack = (Math.floor(t * 38) % 3 === 0) ? 1 : 0.35; b[i] = lp * crack * exp(-t * 7) * 0.9; } return b; },
    glass() { const d = 0.6, b = buf(d); const pings = [2350, 3120, 4180, 2790]; for (let i = 0; i < b.length; i++) { const t = i / RATE; let s = noise() * exp(-t * 25) * 0.4; for (let k = 0; k < pings.length; k++) { const st = t - k * 0.04; if (st > 0) s += sin(2 * PI * pings[k] * st) * exp(-st * 14) * 0.18; } b[i] = s; } return b; },
    stone() { const d = 0.3, b = buf(d); let lp = 0, ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * 0.08; ph += (90 - 40 * t / d) / RATE; b[i] = (lp * 1.4 + sin(ph * 2 * PI) * 0.6) * exp(-t * 14) * 0.8; } return b; },
    pop() { const d = 0.35, b = buf(d); let ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += (90 + 700 * exp(-t * 18)) / RATE; b[i] = (sin(ph * 2 * PI) * 0.7 + noise() * 0.25 * exp(-t * 30)) * exp(-t * 9) * 0.75; } return b; },
    win() { const d = 1.3, b = buf(d), n = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5]; let ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE, k = Math.min(n.length - 1, Math.floor(t / 0.13)), nt = t - k * 0.13; ph += n[k] / RATE; b[i] = (tri(ph) * 0.6 + (fr(ph) < 0.5 ? 0.2 : -0.2)) * exp(-nt * (k === n.length - 1 ? 2.5 : 9)) * 0.5; } return b; },
    lose() { const d = 1.2, b = buf(d), f = svf(); let ph = 0; for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += (330 * pow(0.5, t / d * 1.2)) / RATE; b[i] = f(saw(ph), 500 + 900 * (0.5 + 0.5 * sin(t * 2 * PI * 3)), 0.3) * min(1, (d - t) * 4) * 0.5; } return b; },
    star() { const d = 0.5, b = buf(d); for (let i = 0; i < b.length; i++) { const t = i / RATE; b[i] = (sin(2 * PI * 1568 * t) * 0.5 + sin(2 * PI * 2349 * t) * 0.3) * exp(-t * 7) * 0.5; } return b; },
    click() { const d = 0.05, b = buf(d); for (let i = 0; i < b.length; i++) { const t = i / RATE; b[i] = sin(2 * PI * 900 * t) * exp(-t * 80) * 0.5; } return b; },
    // Bouncy 4-bar loop: C - G - Am - F at 112 BPM.
    music() {
      const step = 60 / 112 / 4, steps = 64, b = buf(step * steps);
      const roots = [261.63, 196.0, 220.0, 174.61], third = [4, 4, 3, 4];
      let bassPh = 0, arpPh = 0, lastBeat = -1, kickPh = 0;
      for (let i = 0; i < b.length; i++) {
        const t = i / RATE, s = Math.min(Math.floor(t / step), steps - 1), st = t - s * step, bar = Math.floor(s / 16), root = roots[bar];
        const tones = [0, third[bar], 7, 12];
        arpPh += root * 2 * pow(2, tones[s % 4] / 12) / RATE;
        const arp = (tri(arpPh) * 0.7 + (fr(arpPh) < 0.5 ? 0.15 : -0.15)) * exp(-st * 14) * 0.16;
        const e8 = Math.floor(s / 2), st8 = t - e8 * 2 * step;
        bassPh += root / 2 * (e8 % 2 ? 1.5 : 1) / RATE;
        const bass = tri(bassPh) * exp(-st8 * 6) * 0.35;
        const beat = Math.floor(s / 4), stb = t - beat * 4 * step;
        if (beat !== lastBeat) { lastBeat = beat; kickPh = 0; }
        kickPh += (50 + 90 * exp(-stb * 30)) / RATE;
        const kick = beat % 2 === 0 ? sin(kickPh * 2 * PI) * exp(-stb * 12) * 0.5 : 0;
        const shaker = s % 2 === 1 ? noise() * exp(-st * 45) * 0.06 : 0;
        const clap = beat % 2 === 1 ? noise() * exp(-stb * 22) * 0.16 : 0;
        b[i] = tanh((arp + bass + kick + shaker + clap) * 1.1) * 0.8;
      }
      return b;
    },
  };
})();
function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
    for (const k of Object.keys(synth)) {
      const data = synth[k]();
      const ab = actx.createBuffer(1, data.length, RATE);
      ab.getChannelData(0).set(data);
      buffers[k] = ab;
    }
  } catch (e) { actx = null; }
}
function unlockAudio() {
  initAudio();
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* unsupported */ }
  if (!actx) return;
  if (actx.state !== 'running') actx.resume().then(() => { if (save.sound) startMusic(); }).catch(() => {});
  else if (save.sound) startMusic();
}
function sfx(name, vol = 0.7, rate = 1) {
  if (!save.sound || !actx || actx.state !== 'running' || active > 20 || !buffers[name]) return;
  const s = actx.createBufferSource(); s.buffer = buffers[name]; s.playbackRate.value = clamp(rate, 0.5, 2);
  const g = actx.createGain(); g.gain.value = clamp(vol, 0, 1);
  s.connect(g); g.connect(master); active++;
  s.onended = () => { active--; s.disconnect(); g.disconnect(); };
  s.start();
}
function startMusic() {
  if (!save.sound || !actx || musicSrc || actx.state !== 'running') return;
  musicSrc = actx.createBufferSource(); musicSrc.buffer = buffers.music; musicSrc.loop = true;
  const g = actx.createGain(); g.gain.value = 0.28;
  musicSrc.connect(g); g.connect(master); musicSrc.start();
}
function stopMusic() { if (musicSrc) { try { musicSrc.stop(); } catch (e) { /* stopped */ } musicSrc = null; } }
let lastVib = 0;
function buzz(ms) { if (!navigator.vibrate) return; const n = performance.now(); if (n - lastVib < 60) return; lastVib = n; try { navigator.vibrate(ms); } catch (e) { /* blocked */ } }

// ======================================================================= levels
// Each builder uses bottom-anchored helpers: b(x, bottomY, w, h, material) returns the top y.
const LEVELS = [
  { name: 'ברוכים הבאים', birds: [FACE, FACE, FACE], build(b, germ) {
    const g = GROUND;
    b(1420, g, 22, 120, 'wood'); b(1540, g, 22, 120, 'wood');
    const top = b(1480, g - 120, 180, 20, 'wood');
    germ(1480, g, 26); germ(1480, top, 26);
  } },
  { name: 'בית זכוכית', birds: [FACE, FACE, FOOT], build(b, germ) {
    const g = GROUND;
    b(1350, g, 20, 110, 'glass'); b(1470, g, 20, 110, 'glass');
    let t = b(1410, g - 110, 160, 20, 'wood');
    b(1410, t, 56, 56, 'glass');
    germ(1410, g, 26);
    b(1580, g, 20, 110, 'glass'); b(1700, g, 20, 110, 'glass');
    t = b(1640, g - 110, 160, 20, 'wood');
    germ(1640, t, 26);
  } },
  { name: 'המגדל', birds: [FACE, FOOT, FACE], build(b, germ) {
    const g = GROUND;
    b(1440, g, 22, 120, 'wood'); b(1560, g, 22, 120, 'wood');
    let t = b(1500, g - 120, 170, 20, 'wood');
    b(1455, t, 22, 100, 'wood'); b(1545, t, 22, 100, 'wood');
    germ(1500, t, 24);
    t = b(1500, t - 100, 140, 20, 'wood');
    b(1465, t, 20, 80, 'glass'); b(1535, t, 20, 80, 'glass');
    t = b(1500, t - 80, 120, 20, 'wood');
    germ(1500, g, 26); germ(1500, t, 26);
  } },
  { name: 'הבונקר', birds: [FOOT, FACE, FOOT], build(b, germ) {
    const g = GROUND;
    b(1400, g, 30, 100, 'stone'); b(1600, g, 30, 100, 'stone');
    const roof = b(1500, g - 100, 250, 20, 'glass');
    b(1430, roof, 40, 40, 'wood'); b(1570, roof, 40, 40, 'wood');
    germ(1500, g, 28); germ(1500, roof, 24);
    b(1730, g, 20, 140, 'wood'); b(1810, g, 20, 140, 'wood');
    const t = b(1770, g - 140, 110, 20, 'wood');
    germ(1770, t, 24);
  } },
  { name: 'על הגבעה', birds: [FACE, FACE, FOOT, FACE], hill: { x: 1600, w: 440, h: 150 }, build(b, germ) {
    const top = GROUND - 150;
    for (let row = 0; row < 3; row++) {
      const n = 5 - row;
      for (let i = 0; i < n; i++) b(1600 - (n - 1) * 25.5 + i * 51, top - row * 50, 50, 50, row === 1 ? 'glass' : 'wood');
    }

    germ(1415, top, 24); germ(1785, top, 24);
  } },
  { name: 'מלך החיידקים', birds: [FACE, FOOT, FACE, FOOT, FACE], build(b, germ) {
    const g = GROUND;
    b(1350, g, 30, 160, 'stone'); b(1650, g, 30, 160, 'stone');
    const beam = b(1500, g - 160, 340, 24, 'wood');
    b(1420, beam, 20, 100, 'glass'); b(1580, beam, 20, 100, 'glass');
    const roof = b(1500, beam - 100, 210, 24, 'stone');
    germ(1500, g, 44, true);
    germ(1500, beam, 26); germ(1500, roof, 26);
    b(1220, g, 20, 120, 'wood'); b(1290, g, 20, 120, 'wood');
    germ(1255, b(1255, g - 120, 100, 20, 'wood'), 24);
    b(1720, g, 20, 120, 'wood'); b(1790, g, 20, 120, 'wood');
    germ(1755, b(1755, g - 120, 100, 20, 'wood'), 24);

// ======================================================================= canvas & camera
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let dpr = 1, cssW = 0, cssH = 0, zoom = 1, viewW = 1100, viewH = 700, camX = 0, camY = 0;
let camMode = 'sling', camManualT = 0, camTargetX = 0;

function resize() {
  cssW = window.innerWidth; cssH = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  zoom = Math.min(cssW / 1100, cssH / 640);
  viewW = cssW / zoom; viewH = cssH / zoom;
  camY = GROUND + 130 - viewH;
  camX = clampCam(camX);
}
function clampCam(x) {
  const lo = -60, hi = LEVEL_W - viewW + 60;
  return hi < lo ? (lo + hi) / 2 : clamp(x, lo, hi);
}
const toWorld = (sx, sy) => [sx / zoom + camX, sy / zoom + camY];
const toScreen = (wx, wy) => [(wx - camX) * zoom, (wy - camY) * zoom];

// ======================================================================= game state
let engine = null;
let levelIdx = 0, level = null;
let state = 'menu';           // menu | intro | aim | flying | settling | won | lost
let paused = false;
let score = 0, shownScore = -1;
let queue = [];               // remaining bird kinds
let bird = null;              // the bird in flight
let aiming = false, pull = { x: 0, y: 0, p: 0 }, aimPointer = null;
let panPointer = null, panLastX = 0;
let germs = [], blocks = [], removeQ = [];
let particles = [], popups = [], trail = [], prevTrail = [];
let timer = 0, settleT = 0, grace = 0, shake = 0, endT = 0, totalPoints = 0, introT = 0, bonusQ = 0, bonusT = 0;
let clouds = [];
let loadId = 0;

function newEngine() {
  engine = Engine.create({ enableSleeping: true, positionIterations: 10, velocityIterations: 8 });
  engine.gravity.y = 1;
  Events.on(engine, 'collisionStart', onCollide);
}

function loadLevel(i) {
  levelIdx = i; level = LEVELS[i]; loadId++;
  newEngine();
  germs = []; blocks = []; removeQ = []; particles = []; popups = []; trail = []; prevTrail = [];
  score = 0; bird = null; aiming = false; aimPointer = null; panPointer = null;
  queue = level.birds.slice();
  const ground = Bodies.rectangle(LEVEL_W / 2, GROUND + 200, LEVEL_W + 1600, 400, { isStatic: true, friction: 0.9, label: 'ground' });
  Composite.add(engine.world, ground);
  if (level.hill) {
    const h = level.hill;
    const hill = Bodies.rectangle(h.x, GROUND - h.h / 2, h.w, h.h, { isStatic: true, friction: 0.9, label: 'hill' });
    Composite.add(engine.world, hill);
  }
  totalPoints = 0;
  const b = (x, bottom, w, h, mat) => {
    const m = MATS[mat];
    const body = Bodies.rectangle(x, bottom - h / 2, w, h, { density: m.density, friction: m.friction, frictionStatic: 1, restitution: 0.02, chamfer: { radius: 2 }, label: 'block', sleepThreshold: 40 });
    body.game = { kind: 'block', mat, w, h, hp: m.hp, maxHp: m.hp };
    blocks.push(body); totalPoints += m.points;
    Composite.add(engine.world, body);
    return bottom - h;
  };
  const germ = (x, bottom, r, king = false) => {
    const body = Bodies.circle(x, bottom - r, r, { density: 0.0015, friction: 0.6, restitution: 0.15, label: 'germ', sleepThreshold: 40 });
    const hp = king ? 260 : r >= 26 ? 70 : 55;
    body.game = { kind: 'germ', r, hp, maxHp: hp, king, blink: rf(1, 4), hurtT: 0 };
    germs.push(body); totalPoints += 5000;
    Composite.add(engine.world, body);
  };
  level.build(b, germ);
  for (const body of engine.world.bodies) if (!body.isStatic) Sleeping.set(body, true);
  grace = 1.2;
  clouds = Array.from({ length: 9 }, (_, k) => ({ x: rf(-200, LEVEL_W + 400), y: rf(80, 520), s: rf(0.6, 1.4), f: rf(0.2, 0.55), k }));
  state = 'intro'; introT = 0;
  camX = clampCam(1500 - viewW / 2); camMode = 'structure';
  document.getElementById('levelName').textContent = `שלב ${i + 1} · ${level.name}`;
  showOnly('hud');
}

// ======================================================================= physics events
function relImpact(a, b, n) {
  const vx = a.velocity.x - b.velocity.x, vy = a.velocity.y - b.velocity.y;
  return Math.abs(vx * n.x + vy * n.y);
}
function onCollide(ev) {
  for (const pair of ev.pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    const v = relImpact(a, b, pair.collision.normal);
    if (bird && (a === bird.body || b === bird.body)) birdHit(v, a === bird.body ? b : a);
    if (v < 2.2 || grace > 0) continue;
    const ma = a.isStatic ? Infinity : a.mass, mb = b.isStatic ? Infinity : b.mass;
    const mu = !isFinite(ma) ? mb : !isFinite(mb) ? ma : (ma * mb) / (ma + mb);
    const energy = 0.5 * mu * v * v;
    if (a.game) hurt(a, energy, v);
    if (b.game) hurt(b, energy, v);
  }
}
function hurt(body, energy, v) {
  const g = body.game;
  if (g.dead || energy < 8) return;
  g.hp -= energy;
  if (g.kind === 'germ') {
    g.hurtT = 0.4;
    if (g.hp <= 0) killGerm(body);
  } else {
    if (v > 4) {
      const m = g.mat;
      sfx(m === 'glass' ? 'glass' : m === 'stone' ? 'stone' : 'wood', clamp(v / 18, 0.15, 0.6), rf(0.9, 1.15));
      if (m !== 'stone' || v > 8) chips(body.position.x, body.position.y, m, 3);
    }
    if (g.hp <= 0) breakBlock(body);
  }
}
function birdHit(v, other) {
  const bd = bird;
  if (!bd.hit) {
    bd.hit = true;
    if (bd.stomping) stompShock(bd.body.position.x, bd.body.position.y);
  }
  if (v > 5 && other.label === 'ground') puff(bd.body.position.x, bd.body.position.y + 20, 4, '#d9c39a');
}
function killGerm(body) {
  const g = body.game;
  if (g.dead) return;
  g.dead = true;
  removeQ.push(body);
  const pts = g.king ? 15000 : 5000;
  addScore(pts, body.position.x, body.position.y - g.r - 10, '#3a9c1f');
  sfx('pop', 0.8, g.king ? 0.7 : rf(0.9, 1.15));
  buzz(30);
  for (let i = 0; i < 18; i++) particles.push({ t: 'drop', x: body.position.x, y: body.position.y, vx: rf(-8, 8), vy: rf(-11, -2), r: rf(4, 10) * (g.r / 26), life: rf(0.5, 1), max: 1, c: i % 3 ? '#74d64b' : '#c8f7a8' });
  puff(body.position.x, body.position.y, 6, '#e8ffd9');
  shake = Math.max(shake, g.king ? 0.6 : 0.25);
}
function breakBlock(body) {
  const g = body.game;
  if (g.dead) return;
  g.dead = true;
  removeQ.push(body);
  addScore(MATS[g.mat].points, body.position.x, body.position.y, '#7a4a1e');
  sfx(g.mat === 'glass' ? 'glass' : g.mat === 'stone' ? 'stone' : 'woodBreak', 0.6, rf(0.85, 1.1));
  chips(body.position.x, body.position.y, g.mat, Math.round(6 + (g.w * g.h) / 500));
  puff(body.position.x, body.position.y, 3, '#efe3cc');
}
function addScore(n, x, y, c) { score += n; popups.push({ x, y, text: String(n), c, life: 1.2 }); }

function stompShock(x, y) {
  const R = 240;
  sfx('stomp', 0.9);
  buzz(120);
  shake = 1;
  popups.push({ x, y: y - 70, text: 'STOMP!', c: '#ff7a1a', life: 1.1, big: true });
  particles.push({ t: 'ring', x, y, r: 10, R, life: 0.45, max: 0.45, c: '#fff6df' });
  puff(x, y, 14, '#e8dcc4');
  for (const body of [...blocks, ...germs]) {
    if (body.game.dead) continue;
    const dx = body.position.x - x, dy = body.position.y - y, d = Math.hypot(dx, dy);
    if (d > R) continue;
    const f = 1 - d / R;
    Sleeping.set(body, false);
    Body.setVelocity(body, { x: body.velocity.x + (dx / (d || 1)) * 11 * f, y: body.velocity.y - 7 * f });
    hurt(body, (body.game.kind === 'germ' ? 120 : 420) * f, 10);
  }
}

// ======================================================================= birds
function makeBirdBody(kind, x, y) {
  const body = kind === FACE
    ? Bodies.circle(x, y, 28, { density: 0.004, friction: 0.6, restitution: 0.35, frictionAir: 0.004, label: 'bird' })
    : Bodies.rectangle(x, y, 40, 78, { density: 0.0065, friction: 0.7, restitution: 0.1, frictionAir: 0.004, chamfer: { radius: 10 }, label: 'bird' });
  return body;
}
function pouch() {
  const len = pull.p * 115;
  return { x: SLING_X + pull.x * len, y: SLING_Y + pull.y * len };
}
function launch() {
  const kind = queue.shift();
  const p = pouch();
  const body = makeBirdBody(kind, p.x, p.y);
  Composite.add(engine.world, body);
  const sp = pull.p * VMAX;
  Body.setVelocity(body, { x: -pull.x * sp, y: -pull.y * sp });
  Body.setAngularVelocity(body, kind === FACE ? 0.05 : 0.08);
  bird = { kind, body, hit: false, used: false, stomping: false, t: 0, still: 0 };
  prevTrail = trail; trail = [];
  sfx('launch', 0.7);
  if (kind === FACE) sfx('bleh', 0.45, 1.25);
  state = 'flying'; camMode = 'follow';
  pull.p = 0;
}
function useAbility() {
  if (!bird || bird.used || bird.hit) return;
  bird.used = true;
  const b = bird.body, p = b.position;
  if (bird.kind === FACE) {
    const sp = Math.max(Math.hypot(b.velocity.x, b.velocity.y) * 1.9, 24);
    const a = Math.atan2(b.velocity.y, b.velocity.x);
    Body.setVelocity(b, { x: Math.cos(a) * sp, y: Math.sin(a) * sp });
    sfx('bleh', 0.9);
    popups.push({ x: p.x, y: p.y - 60, text: 'BLEH!', c: '#ff5f8f', life: 0.9, big: true });
    for (let i = 0; i < 10; i++) particles.push({ t: 'drop', x: p.x, y: p.y + 20, vx: -Math.cos(a) * rf(2, 6) + rf(-2, 2), vy: -Math.sin(a) * rf(2, 6) + rf(-2, 2), r: rf(3, 6), life: rf(0.4, 0.8), max: 0.8, c: '#ffb3c7' });
  } else {
    Body.setAngle(b, 0);
    Body.setAngularVelocity(b, 0);
    Body.setVelocity(b, { x: b.velocity.x * 0.15, y: 34 });
    Body.setDensity(b, 0.014);
    bird.stomping = true;
    sfx('launch', 0.6, 0.6);
    popups.push({ x: p.x, y: p.y - 60, text: '!!!', c: '#ff7a1a', life: 0.6, big: true });
  }
  buzz(40);
}

// ======================================================================= loop
function update(dt) {
  if (grace > 0) grace -= dt;
  timer += dt;
  shake = Math.max(0, shake - dt * 2.2);

  // remove destroyed bodies (deferred out of the collision callback)
  if (removeQ.length) {
    for (const body of removeQ) Composite.remove(engine.world, body);
    // Sleeping bodies don't notice their support vanishing, so wake everything up.
    for (const body of engine.world.bodies) if (!body.isStatic) Sleeping.set(body, false);
    blocks = blocks.filter((b) => !b.game.dead);
    germs = germs.filter((g) => !g.game.dead);
    removeQ = [];
  }
  // anything knocked off the world is gone
  for (const g of germs) if (g.position.y > GROUND + 400 || g.position.x > LEVEL_W + 500 || g.position.x < -500) killGerm(g);
  for (const b of blocks) if (b.position.y > GROUND + 400 || b.position.x > LEVEL_W + 500) { b.game.dead = true; removeQ.push(b); }
  for (const g of germs) { g.game.hurtT = Math.max(0, g.game.hurtT - dt); g.game.blink -= dt; if (g.game.blink < -0.12) g.game.blink = rf(1.5, 4); }

  switch (state) {
    case 'intro':
      introT += dt;
      if (introT > 1.3) { camMode = 'sling'; }
      if (introT > 2.0) state = 'aim';
      break;
    case 'flying': {
      const b = bird.body;
      bird.t += dt;
      if (Math.floor(bird.t * 30) % 2 === 0 && !bird.hit) trail.push({ x: b.position.x, y: b.position.y, big: trail.length % 4 === 0 });
      if (b.speed < 0.35) bird.still += dt; else bird.still = 0;
      const out = b.position.y > GROUND + 300 || b.position.x > LEVEL_W + 400 || b.position.x < -400;
      if (bird.still > 0.9 || out || bird.t > 11) {
        if (!out) puff(b.position.x, b.position.y, 10, '#ffffff');
        Composite.remove(engine.world, b);
        bird = null;
        state = 'settling'; settleT = 0; camMode = 'structure';
      }
      break;
    }
    case 'settling': {
      settleT += dt;
      const moving = engine.world.bodies.some((b) => !b.isStatic && !b.isSleeping && b.speed > 0.25);
      if (!germs.length && settleT > 0.8) { finishWin(); break; }
      if ((!moving && settleT > 0.8) || settleT > 5) {
        if (!germs.length) finishWin();
        else if (queue.length) { state = 'aim'; camMode = 'sling'; }
        else if (settleT > 1.6) finishLose();
      }
      break;
    }
    case 'bonus':
      bonusT -= dt;
      if (bonusT <= 0) {
        if (bonusQ > 0) {
          bonusQ--; queue.shift();
          addScore(10000, SLING_X - 70, GROUND - 120, '#ff7a1a');
          sfx('star', 0.5, 1.2); bonusT = 0.45;
        } else { state = 'won'; endT = 0; showResult(true); }
      }
      break;
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.t === 'ring') { p.r += (p.R - p.r) * Math.min(1, dt * 10); continue; }
    if (p.t === 'puff') { p.r += dt * 40; p.x += p.vx; p.y += p.vy; continue; }
    p.vy += 0.5; p.x += p.vx; p.y += p.vy;
    if (p.rot !== undefined) p.rot += p.vr;
    if (p.y > GROUND - 2 && p.vy > 0) { p.y = GROUND - 2; p.vy *= -0.3; p.vx *= 0.6; }
  }
  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.life -= dt; p.y -= 40 * dt; if (p.life <= 0) popups.splice(i, 1); }

  // camera
  if (camManualT > 0) camManualT -= dt;
  else {
    if (camMode === 'sling') camTargetX = SLING_X - viewW * 0.22;
    else if (camMode === 'structure') camTargetX = 1500 - viewW / 2;
    else if (camMode === 'follow' && bird) camTargetX = bird.body.position.x - viewW * 0.4;
    camX += (clampCam(camTargetX) - camX) * Math.min(1, dt * (camMode === 'follow' ? 6 : 2.6));
  }
  camX = clampCam(camX);
}

function finishWin() {
  if (state === 'bonus' || state === 'won') return;
  state = 'bonus'; bonusQ = queue.length; bonusT = 0.9; camMode = 'sling';
  sfx('win', 0.7);
}
function finishLose() { state = 'lost'; sfx('lose', 0.6); showResult(false); }

function starCount() {
  const birds = level.birds.length;
  const s3 = totalPoints * 0.62 + 10000 * Math.floor((birds - 1) / 2);
  const s2 = totalPoints * 0.4;
  return score >= s3 ? 3 : score >= s2 ? 2 : 1;
}

// ======================================================================= render
function render() {
  const k = zoom * dpr;
  let sx = 0, sy = 0;
  if (shake > 0) { const m = shake * shake * (REDUCED ? 3 : 14); sx = rf(-m, m); sy = rf(-m, m); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawSky();
  ctx.setTransform(k, 0, 0, k, (-camX + sx) * k, (-camY + sy) * k);
  drawBackdrop();
  drawGround();
  if (level && level.hill) drawHill(level.hill);
  if (!level) return;
  drawSlingBack();
  drawTrail(prevTrail, 0.35); drawTrail(trail, 0.9);
  for (const b of blocks) drawBlock(b);
  for (const g of germs) drawGerm(g);
  drawQueue();
  if (bird) drawBird(bird.kind, bird.body.position.x, bird.body.position.y, bird.body.angle, bird.stomping);
  drawSlingFront();
  drawAimGuide();
  drawParticles();
  drawPopups();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, '#5fbff5'); g.addColorStop(0.65, '#bfe8ff'); g.addColorStop(1, '#f2fbff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function drawBackdrop() {
  // sun
  const sunX = camX * 0.85 + viewW * 0.78, sunY = camY + 160;
  ctx.fillStyle = 'rgba(255,240,170,0.5)'; ctx.beginPath(); ctx.arc(sunX, sunY, 110, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3a8'; ctx.beginPath(); ctx.arc(sunX, sunY, 70, 0, Math.PI * 2); ctx.fill();
  // clouds (parallax)
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  for (const c of clouds) {
    const x = c.x + camX * c.f + timer * 6 * c.s, y = Math.max(c.y, camY + 60 + c.k * 40) ;
    const s = c.s;
    ctx.beginPath();
    ctx.arc(x, y, 34 * s, 0, Math.PI * 2); ctx.arc(x + 40 * s, y - 16 * s, 44 * s, 0, Math.PI * 2);
    ctx.arc(x + 88 * s, y, 32 * s, 0, Math.PI * 2); ctx.rect(x, y - 4 * s, 88 * s, 34 * s);
    ctx.fill();
  }
  // far hills
  hills(0.55, GROUND - 40, 170, '#9fd9a0', 520);
  hills(0.3, GROUND - 10, 110, '#7cc77a', 360);
}
function hills(f, baseY, amp, color, period) {
  const off = camX * f;
  ctx.fillStyle = color;
  ctx.beginPath();
  const x0 = camX - 50, x1 = camX + viewW + 50;
  ctx.moveTo(x0, GROUND + 50);
  for (let x = x0; x <= x1; x += 25) {
    const u = (x - off) / period;
    ctx.lineTo(x, baseY - amp * (0.55 + 0.45 * Math.sin(u * Math.PI * 2) * Math.sin(u * 2.3)));
  }
  ctx.lineTo(x1, GROUND + 50);
  ctx.fill();
}
function drawGround() {
  const x0 = camX - 100, w = viewW + 200;
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x0, GROUND, w, 400);
  ctx.fillStyle = '#6f4520';
  for (let x = Math.floor(x0 / 60) * 60; x < x0 + w; x += 60) { ctx.beginPath(); ctx.arc(x + 20, GROUND + 60 + (x % 120 ? 30 : 0), 8, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#5cc93b'; ctx.fillRect(x0, GROUND - 4, w, 22);
  ctx.fillStyle = '#48a82b'; ctx.fillRect(x0, GROUND + 14, w, 6);
}
function drawHill(h) {
  const x = h.x - h.w / 2, y = GROUND - h.h;
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.moveTo(x - 40, GROUND); ctx.lineTo(x, y + 20); ctx.quadraticCurveTo(x, y, x + 20, y); ctx.lineTo(x + h.w - 20, y); ctx.quadraticCurveTo(x + h.w, y, x + h.w, y + 20); ctx.lineTo(x + h.w + 40, GROUND); ctx.fill();
  ctx.fillStyle = '#5cc93b'; ctx.fillRect(x + 6, y - 4, h.w - 12, 18);
}
function drawSlingBack() {
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#6b3d16'; ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(SLING_X, GROUND); ctx.lineTo(SLING_X, SLING_Y + 60); ctx.lineTo(SLING_X + 26, SLING_Y - 8); ctx.stroke();
  ctx.strokeStyle = '#8b5424'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(SLING_X, GROUND); ctx.lineTo(SLING_X, SLING_Y + 60); ctx.lineTo(SLING_X + 26, SLING_Y - 8); ctx.stroke();
  if (state === 'aim' && queue.length) {
    const p = pouch();
    ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(SLING_X + 26, SLING_Y - 4); ctx.lineTo(p.x + 10, p.y + 6); ctx.stroke();
    ctx.fillStyle = '#4a2c14'; ctx.beginPath(); ctx.ellipse(p.x - 2, p.y + 8, 22, 12, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = '#6b3d16'; ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(SLING_X, SLING_Y + 60); ctx.lineTo(SLING_X - 24, SLING_Y - 8); ctx.stroke();
  ctx.strokeStyle = '#a0632b'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(SLING_X, SLING_Y + 60); ctx.lineTo(SLING_X - 24, SLING_Y - 8); ctx.stroke();
}
function drawSlingFront() {
  if (!(state === 'aim' && queue.length)) return;
  const p = pouch();
  drawBird(queue[0], p.x, p.y, 0, false);
  if (pull.p < 0.05) return;
  ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(SLING_X - 24, SLING_Y - 4); ctx.lineTo(p.x - 12, p.y + 6); ctx.stroke();
}
function drawAimGuide() {
  if (state !== 'aim' || pull.p < 0.08) return;
  const p = pouch(), sp = pull.p * VMAX;
  let x = p.x, y = p.y, vx = -pull.x * sp, vy = -pull.y * sp;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  for (let i = 0; i < 46; i++) {
    for (let s = 0; s < 3; s++) { vy += G_STEP; vx *= 0.996; vy *= 0.996; x += vx; y += vy; }
    if (y > GROUND) break;

}
function drawTrail(t, a) {
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  for (const d of t) { ctx.beginPath(); ctx.arc(d.x, d.y, d.big ? 7 : 4, 0, Math.PI * 2); ctx.fill(); }
}
function drawQueue() {
  const waiting = state === 'aim' ? queue.slice(1) : queue.slice(state === 'bonus' ? 0 : 0);
  for (let i = 0; i < waiting.length; i++) {
    const x = SLING_X - 80 - i * 64, hop = Math.max(0, Math.sin(timer * 5 + i * 1.7)) * 10;
    const kind = waiting[i];
    drawBird(kind, x, GROUND - (kind === FACE ? 28 : 39) - hop, 0, false, 0.85);
  }
}
function drawBird(kind, x, y, angle, stomping, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = 'rgba(59,36,18,0.18)';
  if (kind === FACE) {
    if (imgFace.complete && imgFace.naturalWidth) {
      const s = (28 * 1.2 * scale) / 116;
      ctx.drawImage(imgFace, -116 * s, -150 * s, imgFace.naturalWidth * s, imgFace.naturalHeight * s);
    } else { ctx.fillStyle = '#f1c6a2'; ctx.beginPath(); ctx.arc(0, 0, 28 * scale, 0, Math.PI * 2); ctx.fill(); }
  } else {
    if (stomping) { ctx.fillStyle = 'rgba(255,122,26,0.35)'; ctx.beginPath(); ctx.ellipse(0, -60, 18, 50, 0, 0, Math.PI * 2); ctx.fill(); }
    if (imgFoot.complete && imgFoot.naturalWidth) {
      const w = 46 * scale, h = w * imgFoot.naturalHeight / imgFoot.naturalWidth;
      ctx.drawImage(imgFoot, -w / 2, -h / 2, w, h);
    } else { ctx.fillStyle = '#f4f1ea'; ctx.fillRect(-20 * scale, -39 * scale, 40 * scale, 78 * scale); }
  }

}
function drawBlock(b) {
  const g = b.game, m = MATS[g.mat];
  ctx.save();
  ctx.translate(b.position.x, b.position.y);
  ctx.rotate(b.angle);
  const w = g.w, h = g.h, x = -w / 2, y = -h / 2;
  ctx.fillStyle = m.fill;
  ctx.strokeStyle = m.dark; ctx.lineWidth = 3;
  roundRect(x, y, w, h, 4);
  if (g.mat === 'glass') { ctx.globalAlpha = 0.75; ctx.fill(); ctx.globalAlpha = 1; } else ctx.fill();
  ctx.stroke();
  ctx.lineWidth = 2;
  if (g.mat === 'wood') {
    ctx.strokeStyle = m.light;
    const along = w > h;
    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      if (along) { ctx.moveTo(x + 6, y + (h * i) / 3); ctx.lineTo(x + w - 6, y + (h * i) / 3); }
      else { ctx.moveTo(x + (w * i) / 3, y + 6); ctx.lineTo(x + (w * i) / 3, y + h - 6); }
      ctx.stroke();
    }
  } else if (g.mat === 'glass') {
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + 5, y + h * 0.35); ctx.lineTo(x + w * 0.35, y + 5); ctx.stroke();
  } else {
    ctx.fillStyle = m.dark;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + w * (0.2 + 0.2 * i), y + h * (i % 2 ? 0.3 : 0.7), 2.5, 0, Math.PI * 2); ctx.fill(); }
  }
  const dmg = 1 - g.hp / g.maxHp;
  if (dmg > 0.33) {
    ctx.strokeStyle = 'rgba(40,20,5,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + w * 0.2, y + h * 0.15); ctx.lineTo(x + w * 0.45, y + h * 0.5); ctx.lineTo(x + w * 0.3, y + h * 0.85);
    if (dmg > 0.66) { ctx.moveTo(x + w * 0.45, y + h * 0.5); ctx.lineTo(x + w * 0.8, y + h * 0.4); ctx.moveTo(x + w * 0.7, y + h * 0.1); ctx.lineTo(x + w * 0.6, y + h * 0.6); }
    ctx.stroke();
  }
  ctx.restore();
}
function drawGerm(b) {
  const g = b.game, r = g.r, x = b.position.x, y = b.position.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(b.angle);
  const wob = 1 + Math.sin(timer * 4 + x) * 0.03;
  // spikes
  ctx.fillStyle = g.king ? '#4fae2c' : '#5bbd36';
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + timer * 0.3;
    ctx.beginPath(); ctx.arc(Math.cos(a) * r * 1.02, Math.sin(a) * r * 1.02, r * 0.2, 0, Math.PI * 2); ctx.fill();
  }
  const grd = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  grd.addColorStop(0, '#c8f7a8'); grd.addColorStop(1, g.hurtT > 0 ? '#d6c24a' : '#62c63c');
  ctx.fillStyle = grd;
  ctx.strokeStyle = '#2f6e17'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 0, r * wob, r / wob, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
  // eyes stay upright and look at the action
  const target = bird ? bird.body.position : { x: SLING_X, y: SLING_Y };
  const la = Math.atan2(target.y - y, target.x - x);
  const blink = g.blink < 0;
  for (const side of [-1, 1]) {
    const ex = x + side * r * 0.36, ey = y - r * 0.18, er = r * 0.26;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2f6e17'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ex, ey, er, blink ? er * 0.15 : er, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (!blink) { ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(ex + Math.cos(la) * er * 0.45, ey + Math.sin(la) * er * 0.45, er * 0.45, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = '#2f6e17'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(ex - er * 1.1 * side * -1, ey - er * 1.5); ctx.lineTo(ex + er * 0.9 * side * -1, ey - er * 1.0); ctx.stroke();
  }
  // grin
  ctx.strokeStyle = '#2f6e17'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y + r * 0.2, r * 0.38, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  if (g.king) {
    ctx.fillStyle = '#ffc828'; ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 3;
    ctx.beginPath();
    const cy = y - r - 4;
    ctx.moveTo(x - r * 0.6, cy + 14); ctx.lineTo(x - r * 0.6, cy - 10); ctx.lineTo(x - r * 0.3, cy + 2); ctx.lineTo(x, cy - 16); ctx.lineTo(x + r * 0.3, cy + 2); ctx.lineTo(x + r * 0.6, cy - 10); ctx.lineTo(x + r * 0.6, cy + 14);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    if (p.t === 'ring') {
      ctx.strokeStyle = p.c; ctx.lineWidth = 10 * a + 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    } else if (p.t === 'puff') {
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (p.t === 'chip') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.shard) { ctx.beginPath(); ctx.moveTo(0, -p.r); ctx.lineTo(p.r * 0.7, p.r); ctx.lineTo(-p.r * 0.7, p.r * 0.6); ctx.fill(); }
      else ctx.fillRect(-p.r, -p.r * 0.4, p.r * 2, p.r * 0.8);
      ctx.restore();
    } else {
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }

}
function drawPopups() {
  ctx.textAlign = 'center';
  for (const p of popups) {
    const a = clamp(p.life / 0.4, 0, 1), size = p.big ? 54 : 30;
    ctx.globalAlpha = a;
    ctx.font = `400 ${size}px "Secular One", Rubik, sans-serif`;
    ctx.lineWidth = p.big ? 8 : 6; ctx.strokeStyle = '#3b2412'; ctx.lineJoin = 'round';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.big ? p.c : '#fff';

}
function roundRect(x, y, w, h, r) {

  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);

function chips(x, y, mat, n) {
  const m = MATS[mat];
  for (let i = 0; i < n; i++) particles.push({ t: 'chip', x: x + rf(-10, 10), y: y + rf(-10, 10), vx: rf(-7, 7), vy: rf(-10, -2), r: rf(4, 9), rot: rf(0, 6), vr: rf(-0.3, 0.3), life: rf(0.6, 1.2), max: 1.2, c: i % 2 ? m.fill : m.dark, shard: mat === 'glass' });

}

// ======================================================================= input
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  unlockAudio();
  if (paused || !level) return;
  if (state === 'flying') { useAbility(); return; }
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  const [bx, by] = toScreen(SLING_X, SLING_Y);
  const near = Math.hypot(e.clientX - bx, e.clientY - by) < Math.max(70, 95 * zoom) || (wx < SLING_X + 160 && Math.abs(wy - SLING_Y) < 220);
  if (state === 'aim' && queue.length && near && !aimPointer) {
    aimPointer = e.pointerId; aiming = true; camManualT = 0; camMode = 'sling';
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    sfx('stretch', 0.5);
    updatePull(e);
  } else if (!panPointer) {
    panPointer = e.pointerId; panLastX = e.clientX;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
});
function updatePull(e) {
  const [bx, by] = toScreen(SLING_X, SLING_Y);
  let dx = e.clientX - bx, dy = e.clientY - by;
  const maxPx = Math.max(90, Math.min(cssW, cssH) * 0.3);
  const len = Math.hypot(dx, dy);
  if (len < 1) { pull.p = 0; return; }
  pull.x = dx / len; pull.y = dy / len;
  pull.p = Math.min(1, len / maxPx);
  // never fire backwards into the ground behind the sling
  if (pull.x < -0.2) { pull.x = -0.2; const n = Math.hypot(pull.x, pull.y); pull.x /= n; pull.y /= n; }
}
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId === aimPointer) { e.preventDefault(); updatePull(e); }
  else if (e.pointerId === panPointer) {
    camX = clampCam(camX - (e.clientX - panLastX) / zoom);
    panLastX = e.clientX; camManualT = 2.5;
  }
});
function endPointer(e) {
  if (e.pointerId === aimPointer) {
    aimPointer = null; aiming = false;
    if (state === 'aim' && pull.p > 0.18) launch(); else pull.p = 0;
  }
  if (e.pointerId === panPointer) panPointer = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' && state === 'flying') { e.preventDefault(); useAbility(); }
  if (e.key === 'Escape' && level && !['won', 'lost'].includes(state)) togglePause();
});

// ======================================================================= DOM screens
const $ = (id) => document.getElementById(id);
const screens = ['menu', 'levelsScreen', 'pauseScreen', 'resultScreen'];
function showOnly(...ids) {
  for (const s of screens) $(s).hidden = !ids.includes(s);
  $('hud').hidden = !ids.includes('hud');
}
function soundLabel() { const t = save.sound ? 'צליל: פועל' : 'צליל: כבוי'; $('btnSound').textContent = t; $('btnSound2').textContent = t; }
function toggleSound() {
  save.sound = !save.sound; store.set('sound', save.sound);
  if (save.sound) { unlockAudio(); sfx('click'); } else stopMusic();
  soundLabel();
}
function openLevels() {
  const grid = $('levelGrid');
  grid.textContent = '';
  LEVELS.forEach((lv, i) => {
    const unlocked = i === 0 || (save.stars[i - 1] || 0) > 0;
    const st = save.stars[i] || 0;
    const btn = document.createElement('button');
    btn.className = 'lvl'; btn.type = 'button'; btn.disabled = !unlocked;
    btn.setAttribute('aria-label', `שלב ${i + 1}: ${lv.name}${unlocked ? '' : ' (נעול)'}`);
    btn.innerHTML = `<span>${unlocked ? i + 1 : '🔒'}</span><small>${lv.name}</small><span class="st">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</span>`;
    btn.addEventListener('click', () => { unlockAudio(); sfx('click'); paused = false; loadLevel(i); });
    grid.appendChild(btn);
  });
  showOnly('levelsScreen');
}
function togglePause() {
  paused = !paused;
  if (paused) showOnly('hud', 'pauseScreen'); else showOnly('hud');
}
const STAR_SVG = '<svg class="star" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 4l7.6 15.9 17.4 2.3-12.7 12.1 3.2 17.3L30 43.3 14.5 51.6l3.2-17.3L5 22.2l17.4-2.3z"/></svg>';
function showResult(won) {
  const st = won ? starCount() : 0;
  if (won) {
    save.stars[levelIdx] = Math.max(save.stars[levelIdx] || 0, st);
    save.best[levelIdx] = Math.max(save.best[levelIdx] || 0, score);
    store.set('stars', save.stars); store.set('best', save.best);
  }
  $('resultTitle').textContent = won ? (st === 3 ? 'מושלם!' : 'ניצחון!') : 'החיידקים שרדו';
  $('resultScore').textContent = score.toLocaleString('en-US');
  $('resultNote').textContent = won
    ? `שיא בשלב: ${(save.best[levelIdx] || 0).toLocaleString('en-US')}`
    : `נשארו ${germs.length} חיידקים. נסה לפגוע בבסיס של המבנה.`;
  const stars = $('stars');
  stars.innerHTML = STAR_SVG.repeat(3);
  [...stars.children].forEach((s, i) => {
    if (i < st) setTimeout(() => { if (state !== 'won') return; s.classList.add('on'); sfx('star', 0.5, 1 + i * 0.12); }, 650 + i * 330);
  });
  $('btnNext').hidden = !(won && levelIdx < LEVELS.length - 1);
  const id = loadId;
  setTimeout(() => { if (id === loadId && (state === 'won' || state === 'lost')) showOnly('hud', 'resultScreen'); }, won ? 300 : 700);
}

$('btnPlay').addEventListener('click', () => { unlockAudio(); sfx('click'); openLevels(); });
$('btnSound').addEventListener('click', toggleSound);
$('btnSound2').addEventListener('click', toggleSound);
$('btnBackMenu').addEventListener('click', () => { sfx('click'); level = null; showOnly('menu'); });
$('btnPause').addEventListener('click', () => { unlockAudio(); sfx('click'); togglePause(); });
$('btnRestart').addEventListener('click', () => { sfx('click'); paused = false; loadLevel(levelIdx); });
$('btnResume').addEventListener('click', () => { sfx('click'); togglePause(); });
$('btnPauseRestart').addEventListener('click', () => { sfx('click'); paused = false; loadLevel(levelIdx); });
$('btnPauseLevels').addEventListener('click', () => { sfx('click'); paused = false; openLevels(); });
$('btnRetry').addEventListener('click', () => { sfx('click'); loadLevel(levelIdx); });
$('btnNext').addEventListener('click', () => { sfx('click'); loadLevel(levelIdx + 1); });
$('btnResultLevels').addEventListener('click', () => { sfx('click'); openLevels(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (level && ['aim', 'flying', 'settling', 'intro'].includes(state) && !paused) togglePause();
    if (actx) actx.suspend().catch(() => {});
  } else if (actx) actx.resume().catch(() => {});
});

// ======================================================================= main loop
let last = performance.now(), acc = 0;
function physicsStep() {
  Engine.update(engine, STEP);
  update(STEP / 1000);
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (level && engine && !paused) {
    acc += dt;
    let n = 0;
    while (acc >= STEP / 1000 && n < 5) { physicsStep(); acc -= STEP / 1000; n++; }
    if (n === 5) acc = 0;
  } else { timer += dt; }
  if (score !== shownScore) { $('score').textContent = score.toLocaleString('en-US'); shownScore = score; }
  render();
  requestAnimationFrame(frame);
}
function start() {
  resize();
  window.addEventListener('resize', resize);
  clouds = Array.from({ length: 9 }, (_, k) => ({ x: rf(-200, LEVEL_W + 400), y: rf(80, 520), s: rf(0.6, 1.4), f: rf(0.2, 0.55), k }));
  camX = clampCam(0);
  soundLabel();
  initAudio();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ stars: save.stars }));
if (hot && hot.ready) hot.ready(start); else start();

// Test hook so an automated run can play levels deterministically.
window.__ff = {
  load: (i) => { paused = false; loadLevel(i); },
  get state() { return state; },
  get germs() { return germs.length; },
  get blocks() { return blocks.length; },
  get score() { return score; },
  get queue() { return queue.length; },
  stars: () => starCount(),
  shoot(angleDeg, power) { const a = angleDeg * Math.PI / 180; pull.x = -Math.cos(a); pull.y = Math.sin(a); pull.p = power; launch(); },
  ability: () => useAbility(),
  get flyT() { return bird ? bird.t : -1; },
  step(n) { for (let i = 0; i < n; i++) physicsStep(); },
  render,
  positions: () => engine.world.bodies.filter((b) => !b.isStatic).map((b) => [Math.round(b.position.x), Math.round(b.position.y)]),
};
})();
</script>
