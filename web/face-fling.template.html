<title>Face Fling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@500;700;900&display=swap">
<style>
  /* Layout: full-bleed physics stage on canvas; chunky storybook panels float over it for menus, HUD pinned to the safe-area corners. */
  :root {
    --sky: #8fd3ff;
    --cream: #fff6df;
    --bark: #3b2412;
    --wood: #c98b4a;
    --orange: #ff7a1a;
    --germ: #74d64b;
    --gold: #ffc828;
    --muted: #8a6a4c;
    --font-display: "Secular One", "Rubik", system-ui, sans-serif;
    --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--sky);
    color: var(--bark);
    font-family: var(--font-body);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    pointer-events: none;
  }
  .hud[hidden] { display: none !important; }
  .score {
    display: inline-block; transform-origin: left center;
    font-family: var(--font-display);
    font-size: clamp(22px, 5vw, 34px);
    line-height: 1;
    color: #fff;
    -webkit-text-stroke: 1.5px var(--bark);
    paint-order: stroke fill;
    text-shadow: 0 3px 0 var(--bark);
    font-variant-numeric: tabular-nums;
  }
  .level-name { font-size: 14px; font-weight: 700; color: #fff; -webkit-text-stroke: 3px var(--bark); paint-order: stroke fill; margin-top: 6px; }
  .hud-buttons { display: flex; gap: 8px; pointer-events: auto; }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 14px;
    border: 3px solid var(--bark); background: var(--cream); color: var(--bark);
    box-shadow: 0 4px 0 var(--bark);
    font: 900 20px/1 var(--font-body);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bark); }
  .icon-btn:focus-visible, .btn:focus-visible, .lvl:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

  .overlay {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding-inline: 16px;
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: rgba(59, 36, 18, 0.35);
  }
  .overlay[hidden] { display: none !important; }
  .panel {
    width: min(460px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--cream);
    border: 4px solid var(--bark);
    border-radius: 26px;
    box-shadow: 0 8px 0 var(--bark);
    padding: 22px 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center;
  }
  .logo {
    font-family: var(--font-display);
    font-size: clamp(44px, 13vw, 72px);
    line-height: 0.95;
    color: var(--orange);
    -webkit-text-stroke: 3px var(--bark);
    paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--bark);
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .tagline { font-size: 17px; font-weight: 700; margin: 0; text-wrap: balance; }
  .cast { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .cast figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .ball { position: relative; width: 60px; height: 60px; margin-bottom: 26px; border-radius: 50%; background: var(--c); border: 3px solid var(--bark); }
  .ball img { position: absolute; width: 56px; height: auto; left: -1px; top: -9px; max-width: none; }
  .cast-foot { height: 86px; display: grid; place-items: center; }
  .cast-foot img { height: 84px; width: auto; filter: drop-shadow(0 3px 0 rgba(59, 36, 18, 0.35)); }
  .cast figcaption { font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.25; }
  .btn {
    min-width: 180px; padding: 12px 22px;
    border-radius: 18px; border: 4px solid var(--bark);
    background: var(--orange); color: #fff;
    font: 400 24px/1.1 var(--font-display);
    -webkit-text-stroke: 1px var(--bark);
    box-shadow: 0 6px 0 var(--bark);
    cursor: pointer;
  }
  .btn.alt { background: var(--cream); color: var(--bark); -webkit-text-stroke: 0; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--bark); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 34ch; }
  .title { font-family: var(--font-display); font-size: 34px; margin: 0; line-height: 1; }

  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; }
  .lvl {
    aspect-ratio: 1; max-width: 100%;
    border-radius: 18px; border: 4px solid var(--bark);
    background: var(--wood); color: #fff;
    box-shadow: 0 5px 0 var(--bark);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font: 400 26px/1 var(--font-display);
    -webkit-text-stroke: 1px var(--bark);
    cursor: pointer;
  }
  .lvl small { font: 700 10px/1.1 var(--font-body); -webkit-text-stroke: 0; color: var(--cream); }
  .lvl .st { font-size: 15px; letter-spacing: 1px; -webkit-text-stroke: 0; color: var(--gold); text-shadow: 0 1px 0 var(--bark); }
  .lvl[disabled] { background: #a99a8a; cursor: default; }
  .lvl:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 2px 0 var(--bark); }

  .stars { display: flex; gap: 6px; justify-content: center; }
  .star { width: 58px; height: 58px; }
  .star path { fill: #d9cbb5; stroke: var(--bark); stroke-width: 3; stroke-linejoin: round; }
  .star.on path { fill: var(--gold); }
  .star.on { animation: pop 0.45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .big-score { font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  .world-title { grid-column: 1 / -1; font-family: var(--font-display); font-size: 20px; text-align: start; margin-top: 4px; }
  .world-title.total { text-align: center; color: var(--orange); -webkit-text-stroke: 1px var(--bark); font-size: 24px; margin-top: 0; }
  .lvl.w1 { background: #e8794a; }
  .lvl.w2 { background: #3d4a8a; }
  .lvl.w1[disabled], .lvl.w2[disabled] { background: #a99a8a; }
  .score.bump { animation: bump 0.25s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes bump { from { transform: scale(1.25); } to { transform: scale(1); } }
  .overlay:not([hidden]) { animation: fade 0.22s ease-out both; }
  .overlay:not([hidden]) .panel { animation: rise 0.32s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { transform: translateY(24px) scale(0.94); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .overlay:not([hidden]), .overlay:not([hidden]) .panel, .score.bump { animation: none; } }
  @keyframes pop { from { transform: scale(0.2) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
  @media (prefers-reduced-motion: reduce) { .star.on { animation: none; } }
</style>

<canvas id="stage" tabindex="0" aria-label="Face Fling: pull the character back from the slingshot and let go to launch"></canvas>

<div class="hud" id="hud" hidden>
  <div>
    <div class="score" id="score">0</div>
    <div class="level-name" id="levelName"></div>
  </div>
  <div class="hud-buttons">
    <button class="icon-btn" id="btnRestart" type="button" aria-label="התחל שלב מחדש">↻</button>
    <button class="icon-btn" id="btnPause" type="button" aria-label="השהיה">II</button>
  </div>
</div>

<div class="overlay" id="menu" dir="rtl">
  <div class="panel">
    <div class="logo" dir="ltr">FACE<br>FLING</div>
    <p class="tagline">הפרצוף והגבס נגד החיידקים · 24 שלבים · 3 עולמות</p>
    <div class="cast">
      <figure><span class="ball" style="--c:#ff7a1a"><img src="__FACE__" alt=""></span><figcaption>הפרצוף<br>הקש: BLEH מהיר</figcaption></figure>
      <figure><span class="ball" style="--c:#2f9bff"><img src="__FACE__" alt=""></span><figcaption>המתפצל<br>הקש: שלושה פרצופים</figcaption></figure>
      <figure><span class="ball" style="--c:#ff3b3b"><img src="__FACE__" alt=""></span><figcaption>הפצצה<br>הקש: פיצוץ</figcaption></figure>
      <figure><span class="cast-foot"><img src="__FOOT__" alt=""></span><figcaption>הגבס<br>הקש: דריסה</figcaption></figure>
    </div>
    <button class="btn" id="btnPlay" type="button">שחק</button>
    <button class="btn alt" id="btnSound" type="button">צליל: פועל</button>
    <p class="hint">גע בצד שמאל של המסך, משוך אחורה ושחרר. גרור בצד ימין כדי להזיז את המצלמה. הכי טוב עם הטלפון לרוחב.</p>
  </div>
</div>

<div class="overlay" id="levelsScreen" dir="rtl" hidden>
  <div class="panel">
    <h2 class="title">בחר שלב</h2>
    <div class="levels" id="levelGrid"></div>
    <button class="btn alt" id="btnBackMenu" type="button">חזרה</button>
  </div>
</div>

<div class="overlay" id="pauseScreen" dir="rtl" hidden>
  <div class="panel">
    <h2 class="title">השהיה</h2>
    <button class="btn" id="btnResume" type="button">המשך</button>
    <div class="row">
      <button class="btn alt" id="btnPauseRestart" type="button">מחדש</button>
      <button class="btn alt" id="btnPauseLevels" type="button">שלבים</button>
    </div>
    <button class="btn alt" id="btnSound2" type="button">צליל: פועל</button>
  </div>
</div>

<div class="overlay" id="resultScreen" dir="rtl" hidden>
  <div class="panel">
    <h2 class="title" id="resultTitle">ניצחון!</h2>
    <div class="stars" id="stars" dir="ltr"></div>
    <div class="big-score" id="resultScore">0</div>
    <p class="hint" id="resultNote"></p>
    <div class="row">
      <button class="btn" id="btnNext" type="button">השלב הבא</button>
      <button class="btn alt" id="btnRetry" type="button">שוב</button>
      <button class="btn alt" id="btnResultLevels" type="button">שלבים</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
__SCRIPT__
</script>
