plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clashparty.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.clashparty.game'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/clashparty.jks')
            storePassword 'clashparty'
            keyAlias 'clashparty'
            keyPassword 'clashparty'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // The game itself lives in /web and is packaged as the app's assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
