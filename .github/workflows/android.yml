name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and snapshot tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk dynamic-island.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-apk
          path: dynamic-island.apk

      # A release gives a phone-friendly download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/dynamic-island.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: אי דינמי · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dynamic-island.apk
          body: |
            להתקנה: מורידים את `dynamic-island.apk` בטלפון, פותחים ומאשרים התקנה.
            הוראות מלאות ב-README.
