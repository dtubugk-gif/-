name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk dynamic-island.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-apk
          path: dynamic-island.apk

      # One dedicated release, refreshed on every build, gives a stable phone-friendly link:
      # https://github.com/<owner>/<repo>/releases/download/dynamic-island/dynamic-island.apk
      # (This repo hosts other apps too, so "latest" is left alone.)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dynamic-island
          name: אי דינמי
          target_commitish: ${{ github.sha }}
          make_latest: false
          overwrite_files: true
          files: dynamic-island.apk
          body: |
            להתקנה: מורידים את `dynamic-island.apk` בטלפון, פותחים ומאשרים התקנה.
            הוראות מלאות ב-README.

      - name: Unit and snapshot tests
        timeout-minutes: 15
        run: ./gradlew --no-daemon :app:testDebugUnitTest
