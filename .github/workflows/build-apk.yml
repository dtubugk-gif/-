name: Build apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ShakeLight.apk

      - name: Build computer receivers
        working-directory: receiver
        run: |
          go vet ./...
          build() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w" -o "../$3" .; }
          build windows amd64 ShakeLight-Receiver-Windows.exe
          build darwin arm64 ShakeLight-Receiver-Mac-AppleSilicon
          build darwin amd64 ShakeLight-Receiver-Mac-Intel
          build linux amd64 ShakeLight-Receiver-Linux
          build linux arm64 ShakeLight-Receiver-Linux-ARM64

      - uses: actions/upload-artifact@v4
        with:
          name: ShakeLight
          path: |
            ShakeLight.apk
            ShakeLight-Receiver-*

      # On the main branch, publish a GitHub Release so the APK can be downloaded straight to a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ShakeLight build ${{ github.run_number }}
          files: |
            ShakeLight.apk
            ShakeLight-Receiver-*
